/* motion in play: the guard pops in, the result badge flips, the arrow turns into place, a caught thief hops out */

@keyframes flip{0%{transform:perspective(260px) rotateY(90deg) scale(.7);opacity:0}100%{transform:none;opacity:1}}

 filter:drop-shadow(.055em 0 0 var(--ink)) drop-shadow(-.055em 0 0 var(--ink)) drop-shadow(0 .055em 0 var(--ink)) drop-shadow(0 -.055em 0 var(--ink)) drop-shadow(0 .09em 0 var(--ink))}

<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const $=id=>document.getElementById(id);
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ds(new Date())}
function load(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* ground speckles: small irregular quail-egg flecks in speckled brown, seeded so they never jump */
(function(){const r=mulberry32(2718),f=[];for(let i=0;i<34;i++){const x=(r()*150).toFixed(1),y=(r()*150).toFixed(1),big=r()<.35,rx=(big?3.4+r()*2.6:1.6+r()*1.8).toFixed(1),ry=(big?2.2+r()*2:1.1+r()*1.4).toFixed(1),rot=Math.round(r()*180),op=(.4+r()*.35).toFixed(2);f.push(`<ellipse cx='${x}' cy='${y}' rx='${rx}' ry='${ry}' transform='rotate(${rot} ${x} ${y})' fill-opacity='${op}'/>`)}
const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><g fill='#8a5a2b'>${f.join('')}</g></svg>`;document.documentElement.style.setProperty('--speck','url("data:image/svg+xml,'+encodeURIComponent(svg)+'")')})();
/* ground pattern patches: 5 soft spots, random per page load, edges favoured so the pattern fades behind text and card */
(function(){const R=Math.random,e=document.querySelectorAll(".gnd"),v={};for(let i=0;i<5;i++){const left=i%2===0;v["--p"+i+"x"]=Math.round(left?R()*28:72+R()*28)+"%";v["--p"+i+"y"]=Math.round(i*22+R()*14-2)+"%";v["--p"+i+"a"]=(.7+R()*.3).toFixed(2);v["--p"+i+"r"]=Math.round(26+R()*16)+"%"}e.forEach(n=>{for(const k in v)n.style.setProperty(k,v[k])})})();
function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('on',s===id));if(id!=='game')hintHide()}
let ac;function tone(f,d,type,vol,slide){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,ac.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);g.gain.setValueAtTime(vol||.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ---------- the board ----------
// Rules: each guard reports a distance band (hot 1, warm 2, cold 3+, caught 0; Manhattan) and the compass direction from the
// guard to the thief. After every miss the thief runs one nest straight away from that guard. A cracked shell marks the
// nest he stood on one guard ago. Everything is deterministic, so a day is just his starting nest.
const N=6,MAXG=5,CELLS=N*N;
const R_=i=>Math.floor(i/N),C_=i=>i%N;
const dist=(a,b)=>Math.abs(R_(a)-R_(b))+Math.abs(C_(a)-C_(b));
function nbrs(i){const r=R_(i),c=C_(i),o=[];if(r>0)o.push(i-N);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);if(c<N-1)o.push(i+1);return o}
// 4-way arrow: the axis where he is farther from the guard (vertical if equal). Index 0 north, 2 east, 4 south, 6 west.
const SHELL_FROM=3; // the shell shows from the 3rd guard on
const DIRN=['north','','east','','south','','west',''];
const DIRE=['⬆️','','➡️','','⬇️','','⬅️',''];
const dirOf=(g,t)=>{const dr=R_(t)-R_(g),dc=C_(t)-C_(g);return Math.abs(dr)>=Math.abs(dc)?(dr<0?0:4):(dc>0?2:6)};
const cmpK=(a,b)=>{for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0};
// Flee rule: one nest up, down, left or right, whichever is farthest from the guard. Tie: the axis where he is already
// farther from the guard (vertical if equal). Still tied at a wall: toward the middle, then lowest nest number.
// If no neighbour is farther away he is cornered and stays put.
function flee(g,t){
  const d0=dist(g,t),vFirst=Math.abs(R_(t)-R_(g))>=Math.abs(C_(t)-C_(g));
  let best=t,bk=null;
  for(const n of nbrs(t)){const d=dist(g,n);if(d<=d0)continue;
    const k=[d,(R_(n)!==R_(t))===vFirst?1:0,-(Math.abs(R_(n)-(N-1)/2)+Math.abs(C_(n)-(N-1)/2)),-n];
    if(!bk||cmpK(k,bk)>0){best=n;bk=k}}
  return best;
}
// positions of the thief when each guard is posted: p[j] is where he stands when guard j lands
function simPos(s0,gs){const p=[s0];for(let j=0;j<gs.length;j++)p.push(p[j]===gs[j]?p[j]:flee(gs[j],p[j]));return p}
// one report as the player sees it: the 4-way arrow only (plus the shell from the third guard on)
const fkey=(g,t)=>g===t?'win':''+dirOf(g,t);
// Belief-set players. Each tracks every starting nest still consistent with all reports so far under the flee rule.
// optPick posts the guard that leaves the fewest survivors (sum of squared class sizes).
const optPick=(cur,k)=>{let bg=-1,bs=1e9;
  for(let g=0;g<CELLS;g++){const m={};let ca=0;
    cur.forEach(p=>{if(p[k]===g){ca++;return}const key=fkey(g,p[k])+'|'+(k>=SHELL_FROM-1?p[k-1]:'-');m[key]=(m[key]||0)+1});
    let s=0;for(const q in m)s+=m[q]*m[q];s-=ca*.01;if(s<bs-1e-9){bs=s;bg=g}}
  return bg};
// Greedy player: ignores that he runs. Taps the middle of the nests that fit the latest arrow only.
function greedyPlay(s0){let t=s0,last=null;
  for(let k=0;k<MAXG;k++){
    const cand=Array.from({length:CELLS},(_,i)=>i).filter(c=>!last||(c!==last[0]&&dirOf(last[0],c)===last[1]));
    const mr=cand.reduce((a,c)=>a+R_(c),0)/cand.length,mc=cand.reduce((a,c)=>a+C_(c),0)/cand.length;
    let g=0,bd=1e9;for(let x=0;x<CELLS;x++){const d=(R_(x)-mr)**2+(C_(x)-mc)**2;if(d<bd-1e-9){bd=d;g=x}}
    if(g===t)return k+1;last=[g,dirOf(g,t)];t=flee(g,t)}
  return 0}
function playOut(s0,pick){
  let C=Array.from({length:CELLS},(_,i)=>i);const gs=[],sizes=[];let ok=true;
  for(let k=0;k<MAXG;k++){
    const g=pick(C.map(s=>simPos(s,gs)),k);gs.push(g);
    const tp=simPos(s0,gs),t=tp[k];
    if(t===g)return {par:k+1,guesses:gs,ok,sizes};
    const key=fkey(g,t)+'|'+(k>=SHELL_FROM-1?tp[k-1]:'-');
    C=C.filter(s=>{const p=simPos(s,gs);return p[k]!==g&&fkey(g,p[k])+'|'+(k>=SHELL_FROM-1?p[k-1]:'-')===key});
    if(!C.includes(s0))ok=false;
    sizes.push(C.length);
  }
  return {par:0,guesses:gs,ok,sizes};
}
const solve=s0=>playOut(s0,optPick);
const PARS=Array.from({length:CELLS},(_,s)=>solve(s));
// A day is a seeded pick of starting nest. Preference: solver par 3 or 4, then 5, then 2. Never par 1 (a freebie).
function genDay(seed){
  const r=mulberry32(hashStr(seed+'#v3')),order=Array.from({length:CELLS},(_,i)=>i);
  for(let i=CELLS-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  for(const tier of [[3,4],[5],[2]]){const s=order.find(x=>tier.includes(PARS[x].par));if(s!==undefined)return {start:s,par:PARS[s].par,solver:PARS[s].guesses}}
  const s=order.find(x=>PARS[x].par>0);return {start:s,par:PARS[s].par,solver:PARS[s].guesses};
}
function check(){
  let bad=0;const hist={},gh={},byStart={},bel=[0,0,0],beln=[0,0,0];
  for(let g=0;g<CELLS;g++)for(let t=0;t<CELLS;t++){if(g===t)continue;const n=flee(g,t),moved=n!==t;
    if(moved&&(!nbrs(t).includes(n)||dist(g,n)<=dist(g,t)))bad++;
    if(!moved&&nbrs(t).some(x=>dist(g,x)>dist(g,t)))bad++;
    if(moved&&nbrs(t).some(x=>dist(g,x)>dist(g,n)))bad++}
  PARS.forEach((p,s)=>{byStart[p.par]=(byStart[p.par]||0)+1;if(!p.ok||p.par<1||p.par>MAXG)bad++;p.sizes.forEach((z,i)=>{if(i<3){bel[i]+=z;beln[i]++}})});
  for(let d=1;d<=60;d++){
    const s='2026-12-'+String(d).padStart(2,'0'),day=genDay(s);
    if(JSON.stringify(genDay(s))!==JSON.stringify(day))bad++;
    if(!(day.start>=0&&day.start<CELLS))bad++;
    const sol=solve(day.start);
    if(!sol.ok||sol.par<2||sol.par>MAXG||sol.par!==day.par)bad++;
    const p=simPos(day.start,day.solver);let caught=0;day.solver.forEach((g,k)=>{if(!caught&&g===p[k])caught=k+1});
    if(caught!==sol.par)bad++;
    hist[sol.par]=(hist[sol.par]||0)+1;
    const gp=greedyPlay(day.start);gh[gp||'fail']=(gh[gp||'fail']||0)+1;
  }
  console.log('Egg Thief self-check, 60 days, solver par spread',JSON.stringify(hist),'| greedy middle-tapper (ignores his running)',JSON.stringify(gh),'| par over all 36 starts',JSON.stringify(byStart),'| avg nests left after clue 1/2/3',(bel[0]/beln[0]).toFixed(1),(bel[1]/Math.max(1,beln[1])).toFixed(1),(bel[2]/Math.max(1,beln[2])).toFixed(1),'| problems:',bad);
}
check();

// ---------- art ----------
// bubbly letters: each its own colour, rotation and baseline
const PAL=[['#fff6e3','#ffb3a7'],['#9fd8d2','#fff6e3'],['#ffb3a7','#fff6e3'],['#fff6e3','#9fd8d2'],['#ff7a3d','#fff6e3'],['#9fd8d2','#ffb3a7'],['#ffb3a7','#9fd8d2'],['#fff6e3','#8a5a2b']];
const ROT=[-7,5,-4,6,-6,4,-5,7],YO=[.03,-.04,.02,-.03,.04,-.02,.03,-.04];
function bub(word,o){o=o||{};let k=o.k||0;return [...word].map(ch=>{
  if(ch===' ')return '<i class="sp"> </i>';
  const p=PAL[k%PAL.length],rot=ROT[k%8],y=YO[k%8];k++;
  const egg=o.egg&&ch===o.egg?'<img class="dot" src="assets/thief.svg" alt="">':'';
  return `<i style="--c:${p[0]};--r:${p[1]};--rot:${rot}deg;--y:${y}em">${ch}${egg}</i>`}).join('')}
function wmHTML(){
  const L=(ch,c,sc,r,y)=>'<span class="L" aria-hidden="true" style="--c:'+c+';--s:'+sc+';--r:'+r+'deg;--y:'+y+'em">'+ch+'</span>';
  const cr='#fff6e3',crS='#f2a21a',pk='#ffb3a7',pkS='#e5655c',bl='#9fd8d2',blS='#4fa7a0',or='#ff7a3d',orS='#d9501a';
  return L('E',cr,crS,-6,.03)+L('G',pk,pkS,4,-.03)+L('G',bl,blS,-4,.03)+'<span class="gap"></span>'+L('T',cr,crS,5,-.02)+L('H',or,orS,-5,.03)
   +'<span class="o" style="--r:5deg;--y:-.02em"><img src="assets/thief.svg" alt=""></span>'+L('E',pk,pkS,-4,.02)+L('F',bl,blS,6,-.03);
}
$('wm').innerHTML=wmHTML();$('wm2').innerHTML=wmHTML();
const sImg=(won,cls)=>`<img class="${cls||''}" src="assets/${won?'badge-caught':'badge-clue'}.svg" alt="">`;
const arrowSVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.4L19.6 14.3L14.4 13.5L14.9 20.5L9.3 20.7L9.7 13.3L4.5 14.2Z" fill="#3b2410"/></svg>';
const arrow=(dir,cls)=>`<span class="ar${cls?' '+cls:''}" style="--a:${dir*45}deg">${arrowSVG}</span>`;
const NESTS=['nest','nest-b','nest-c'];
$('key').innerHTML='<span class="k">'+arrow(2,'in')+'Which way he is</span><span class="k"><img src="assets/crack.svg" alt="">He stood here</span><span class="k">'+sImg(true)+'Caught</span>';
const RULE='After each miss he runs one nest straight away from your guard.';

// ---------- game ----------
let seed,practice,day,guesses=[],locked=false,P=[0];
const sync=()=>{P=simPos(day.start,guesses)};
const won_=k=>guesses[k]===P[k];
const dirAt=k=>guesses[k]===P[k]?-1:dirOf(guesses[k],P[k]);
const hasWon=()=>guesses.some((g,k)=>g===P[k]);
const isOver=()=>hasWon()||guesses.length>=MAXG;
function begin(s,p){
  seed=s;practice=p;locked=false;day=genDay(s);
  const done=!p&&load('et3_'+s,null);
  if(done){guesses=done.g;sync();return showCard()}
  guesses=p?[]:load('et3_p_'+s,[]);sync();
  show('game');render(-1);
  hintOn=false;hintDemo=false;hintHide();
  if(!guesses.length&&!load('et_hints',false)&&!/[?&]demo=/.test(location.search)){hintOn=true;hintStep=1;hintT=setTimeout(hintShow,250)}
}
function sayHTML(){
  const n=guesses.length;
  if(!n)return '<div class="tx">Tap a nest to post a guard.<small>Guard 1 of 5. He then runs a nest away.</small></div>';
  const w=won_(n-1),big=w?sImg(w,'big'):'<span class="ht big">'+sImg(w)+arrow(dirAt(n-1))+'</span>';
  if(w)return '<div class="tx">Caught him!<small>Guard '+n+' of 5. Cuffs on.</small></div>'+big;
  if(n>=MAXG)return '<div class="tx">He got away.<small>The thief was never where you looked.</small></div>'+big;
  const msg='He is '+DIRN[dirAt(n-1)]+' of that guard.';
  return '<div class="tx">'+msg+'<small>'+'Guard '+(n+1)+' of 5. He then runs a nest away.</small></div>'+big;
}
const DEBUG=false; // TEMP: set true to show where the thief is
function dbg(i){
  if(!DEBUG)return '';
  let s='';
  if(!isOver()&&P[guesses.length]===i)s+='<span class="dbg now"><img src="assets/thief.svg" alt="" style="width:60%"></span>';
  P.slice(0,guesses.length).forEach((p,k)=>{if(p===i)s+='<span class="trail">he was here at guess '+(k+1)+'</span>'});
  return s;
}
function render(flip){
  $('streak').textContent=load('et_streak',0)?'Streak '+load('et_streak',0):'';
  const over=isOver(),n=guesses.length,shell=n>=SHELL_FROM?P[n-2]:-1;
  $('slots').innerHTML=Array.from({length:MAXG},(_,i)=>{
    if(i<n){const w=won_(i);return `<div class="slot${i===flip?' stamp':''}" role="img" aria-label="Guard ${i+1}: ${w?'Caught':'he is to the '+DIRN[dirAt(i)]}">${sImg(w,'bd')}${w?'':arrow(dirAt(i))}<span class="nc">${i+1}</span></div>`}
    return `<div class="slot ${i===n&&!over?'now':''}"><span class="nc" style="background:none;color:var(--ink)">${i+1}</span></div>`}).join('');
  let h='';
  for(let i=0;i<CELLS;i++){
    const ks=[];guesses.forEach((g,k)=>{if(g===i)ks.push(k)});
    const r=Math.floor(i/4)+1,c=i%4+1,sh=shell===i?'<img class="shell" src="assets/crack.svg" alt="">':'',shA=shell===i?', cracked shell, he stood here a guard ago':'';
    if(!ks.length){h+=`<button class="nest" data-i="${i}" aria-label="Nest row ${r} column ${c}${shA}"><img class="n" src="assets/${NESTS[(i+(i>>2))%3]}.svg" alt="">${sh}${dbg(i)}</button>`;continue}
    const last=ks[ks.length-1],w=won_(last);
    h+=`<button class="nest${last===flip?' new':''}" data-i="${i}" aria-label="Nest row ${r} column ${c}, guard ${ks.map(k=>k+1).join(' and ')}, ${w?'Caught':'he is to the '+DIRN[dirAt(last)]}${shA}">${sImg(w,'bd')}${w?'':arrow(dirAt(last))}<img class="gc" src="assets/guard.svg" alt=""><span class="nc">${ks.map(k=>k+1).join('·')}</span>${w?'<img class="cth" src="assets/thief.svg" alt="">':''}${sh}${dbg(i)}</button>`;
  }

<script>
/* Hand-cut corners v2: rough, hand-torn edges drawn as a vector clip-path outline (crisp at any pixel density, no filters). */
(function(){
  var st=document.createElement("style");st.textContent="[data-hp=b]::before{clip-path:var(--hcp);-webkit-clip-path:var(--hcp)}[data-hp=a]::after{clip-path:var(--hcp);-webkit-clip-path:var(--hcp)}";document.head.appendChild(st);

    var k=0;

      var a=segs[s],len=Math.hypot(a[2]-a[0],a[3]-a[1]),m=Math.max(2,Math.round(len/step));
      var nx=[0,1,0,-1][s],ny=[-1,0,1,0][s];
      for(var i=0;i<m;i++){var t=i/m,x=a[0]+(a[2]-a[0])*t,y=a[1]+(a[3]-a[1])*t;

        pts.push([c[0]+Math.cos(an)*(r+d2),c[1]+Math.sin(an)*(r+d2)])}
