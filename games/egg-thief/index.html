<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Egg Thief</title>
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<style>
@font-face{font-family:"Allo";src:url("../../shared/AlloVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--coral:#ff7a45;--tint:#ff8b5c;--ink:#4a1500;--cream:#fff4dc;--card:#fffaf0;--tile:#f6e8cf;--sun:#ffc93c;--pink:#ff6eb4;--mint:#3ad6a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ink);font-family:"Allo",system-ui,sans-serif;font-weight:700;overflow:hidden;touch-action:manipulation;user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:var(--coral);container-type:inline-size}
section{position:absolute;inset:0;display:none;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
section.on{display:flex}
img{display:block}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* loud ground: broad low contrast stripes plus faint dots */
.gnd{background:radial-gradient(rgba(255,255,255,.28) 1.6px,transparent 2.2px) 0 0/16px 16px,repeating-linear-gradient(-35deg,var(--coral) 0 56px,var(--tint) 56px 112px)}
/* buttons: black, rectangular */
.btn{border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;font-size:20px;padding:12px 44px;min-height:52px;cursor:pointer}
.btn:active{transform:translateY(2px)}
.link{background:none;border:0;font-weight:800;font-size:16px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:12px 16px;min-height:48px}
/* bubbly wordmark: ring colour inside, ink outline outside, solid drop below */
.wm{--fs:min(27cqw,116px);font-size:var(--fs);font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;line-height:.9;text-transform:uppercase;margin:0;
 filter:drop-shadow(.055em 0 0 var(--ink)) drop-shadow(-.055em 0 0 var(--ink)) drop-shadow(0 .055em 0 var(--ink)) drop-shadow(0 -.055em 0 var(--ink)) drop-shadow(0 .09em 0 var(--ink))}
.wm i,.bb i{display:inline-block;position:relative;font-style:normal;color:var(--c);-webkit-text-stroke:.13em var(--r);paint-order:stroke fill;transform:translateY(var(--y)) rotate(var(--rot));margin:0 -.015em}
.wm i.sp,.bb i.sp{width:.28em;-webkit-text-stroke:0}
.ln{display:block;white-space:nowrap}
.dot{position:absolute;left:50%;top:-.84em;width:.8em;max-width:none;transform:translateX(-46%) rotate(9deg);-webkit-text-stroke:0}
#start{align-items:center;justify-content:center;text-align:center}
#start .mid{display:flex;flex-direction:column;align-items:center;gap:0;width:100%}
.lock{width:max-content;max-width:100%;display:flex;flex-direction:column}
.lock .l1{align-self:flex-start;font-size:.66em;margin:0 0 .1em -.02em}
.lock .l2{margin-top:.62em}
.lock .tag{align-self:flex-end;font-size:.46em;margin:.14em .12em 0 0;transform:rotate(-6deg)}
.one{margin:34px 0 22px;font-size:20px;line-height:1.3;font-weight:800;max-width:19em;text-wrap:balance}
#sfine{margin-top:16px;font-size:15px;font-weight:700}
/* play screen: calm */
#game{background:var(--coral)}
.card{flex:0 1 auto;margin:auto 0;min-height:0;background:var(--card);border-radius:20px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.card header{display:flex;align-items:center;gap:10px}
.card header img{width:40px;height:40px}
.card .nm{font-weight:900;font-size:22px;flex:1;font-variation-settings:"ROND" 100}
#streak{background:var(--sun);border-radius:10px;padding:5px 11px;font-weight:800;font-size:15px}
#streak:empty{display:none}
#posts{display:flex;align-items:center;gap:10px}
#posts>img{width:44px;height:44px;flex:none}
#slots{display:flex;gap:8px;flex:1}
.slot{position:relative;flex:1;max-width:56px;aspect-ratio:1;min-height:44px;border-radius:12px;background:var(--tile);display:grid;place-items:center}
.slot.now{outline:3px solid var(--ink);outline-offset:-3px;background:var(--card)}
.slot .bd{position:absolute;inset:0;width:100%;height:100%}
.nc{position:absolute;left:3px;top:3px;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--cream);font-weight:800;font-size:14px;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums;line-height:1}
.slot.stamp,.nest.new .bd{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:.2}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,calc(100dvh - 400px));min-width:216px;margin:0 auto}
.nest{position:relative;border:0;background:var(--tile);border-radius:14px;padding:0;aspect-ratio:1;min-height:48px;cursor:pointer;display:block}
.nest>img.n{position:absolute;inset:10%;width:80%;height:80%}
.nest .bd{position:absolute;inset:0;width:100%;height:100%;border-radius:14px}
.nest:active{transform:scale(.94)}
.dbg{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.dbg svg{width:72%;height:auto}
.trail{position:absolute;left:4px;bottom:3px;font-size:14px;font-weight:800;background:var(--ink);color:var(--cream);padding:1px 5px;pointer-events:none}
#key{display:flex;gap:6px 14px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:700;font-size:14px}
#key .k{display:flex;align-items:center;gap:5px}
#key img{width:26px;height:26px}
#say{display:flex;align-items:center;gap:12px;min-height:76px}
#say .tx{flex:1;font-weight:900;font-size:22px;line-height:1.15}
#say .tx small{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;line-height:1.3;margin-top:5px}
#say .tx small img{width:14px;height:22px;display:inline-block;flex:none}
#say .big{width:68px;height:68px;flex:none;animation:pop .35s ease-out}
/* result: loud again */
#end{overflow-y:auto;align-items:center;gap:12px}
#end .wm.sm{--fs:min(10cqw,44px)}
#end .wm.sm .ln{text-align:center}
#end .bb{--fs:min(15cqw,64px);font-size:var(--fs);font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;line-height:.95;text-transform:uppercase;text-align:center;transform:rotate(-3deg);margin:6px 0 4px;
 filter:drop-shadow(.055em 0 0 var(--ink)) drop-shadow(-.055em 0 0 var(--ink)) drop-shadow(0 .055em 0 var(--ink)) drop-shadow(0 -.055em 0 var(--ink)) drop-shadow(0 .09em 0 var(--ink))}
.res{width:100%;background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.res .head{display:flex;align-items:center;gap:14px}
.res .head img{width:56px;height:auto;flex:none}
#cdate{font-size:14px;font-weight:700}
#ctitle{font-weight:900;font-size:22px;line-height:1.1}
.score{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;margin-left:auto}
.score b{font-size:56px;line-height:.9;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32}
.score span{font-size:22px;font-weight:800}
.hist{display:flex;gap:8px}
.hist img{flex:1;min-width:0;max-width:56px;height:auto;aspect-ratio:1}
.rr{display:flex;align-items:center;gap:14px}
.route{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:176px;flex:none}
.route i{aspect-ratio:1;background:var(--tile);border-radius:8px;position:relative;font-style:normal;display:grid;place-items:center}
.route i img{width:58%}
.route i b{position:absolute;right:3px;bottom:1px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.rr p{margin:0;font-size:15px;line-height:1.35;font-weight:700}
#end .act{display:flex;flex-direction:column;align-items:center;gap:8px}
#cfine{font-size:15px;font-weight:700;text-align:center}
@media (max-width:400px){.one{font-size:18px}.btn{padding:12px 36px}}
@media (max-height:700px){#say{min-height:64px}#say .big{width:56px;height:56px}.card{gap:8px;padding:12px}#grid{width:min(100%,calc(100dvh - 360px))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <section id="start" class="on gnd">
    <div class="mid">
      <h1 class="wm" id="wm" aria-label="Egg Thief. Catch him!"></h1>
      <p class="one">A thief hides on one of 16 nests. Post up to 5 guards and catch him.</p>
      <button class="btn" id="play">Play</button>
      <div id="sfine"></div>
    </div>
  </section>

  <section id="game">
    <div class="card">
      <header><img src="assets/mark.svg" alt=""><div class="nm">Egg Thief</div><div id="streak"></div></header>
      <div id="posts" aria-label="Your guards"><img src="assets/guard.svg" alt="Guard"><div id="slots"></div></div>
      <div id="grid" aria-label="Nests"></div>
      <div id="key" aria-label="Key"></div>
      <div id="say"></div>
    </div>
  </section>

  <section id="end" class="gnd">
    <h2 class="wm sm" id="wm2" style="margin-top:36px" aria-label="Egg Thief"></h2>
    <div class="bb" id="verdict"></div>
    <div class="res">
      <div class="head"><img src="assets/thief.svg" alt=""><div><div id="cdate"></div><div id="ctitle"></div></div><div class="score"><b id="cscore"></b><span>/ 5</span></div></div>
      <div class="hist" id="rtiles" aria-label="Result"></div>
      <div class="rr"><div class="route" id="route" aria-label="His route"></div><p id="par"></p></div>
    </div>
    <div class="act"><button class="btn" id="copy">Copy result</button><div id="cfine"></div><button class="link" id="prac">Practice case</button></div>
  </section>
</div>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const $=id=>document.getElementById(id);
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ds(new Date())}
function load(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('on',s===id))}
let ac;function tone(f,d,type,vol,slide){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,ac.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);g.gain.setValueAtTime(vol||.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ---------- the board ----------
const MAXG=5,CELLS=16;
const dist=(a,b)=>Math.abs((a>>2)-(b>>2))+Math.abs((a&3)-(b&3));
function nbrs(i){const r=i>>2,c=i&3,o=[];if(r>0)o.push(i-4);if(r<3)o.push(i+4);if(c>0)o.push(i-1);if(c<3)o.push(i+1);return o}
// feedback index: 0 cold (3+), 1 warm (2), 2 hot (1), 3 caught (0)
const col=d=>d===0?3:d===1?2:d===2?1:0;
const KEY=[{k:'cold',n:'Cold',e:'🟦',s:'badge-cold'},{k:'warm',n:'Warm',e:'🟧',s:'badge-warm'},{k:'hot',n:'Hot',e:'🟥',s:'badge-hot'},{k:'win',n:'Caught',e:'🟩',s:'badge-caught'}];
function movesOf(set){const s=new Set();set.forEach(x=>nbrs(x).forEach(n=>s.add(n)));return [...s]}

// Belief-set solver. Tracks every nest the thief could be on, assuming he must step to a neighbour after each miss.
// Picks the guard that leaves the smallest expected set for the next turn (caught counts as zero).
function solve(path){
  let B=Array.from({length:CELLS},(_,i)=>i);const gs=[];
  for(let k=0;k<MAXG;k++){
    let bestG=-1,bestS=1e9;
    for(let g=0;g<CELLS;g++){
      const cls=[[],[],[],[]];B.forEach(x=>cls[col(dist(g,x))].push(x));
      let s=0;for(let c=0;c<3;c++)if(cls[c].length)s+=cls[c].length*(moveAfter(k)?movesOf(cls[c]).length:cls[c].length);
      if(!B.includes(g))s+=.5;
      if(s<bestS-1e-9){bestS=s;bestG=g}
    }
    gs.push(bestG);
    const f=col(dist(bestG,path[k]));
    if(f===3)return {par:k+1,guesses:gs};
    const kept=B.filter(x=>col(dist(bestG,x))===f);
    B=moveAfter(k)?movesOf(kept):kept;
  }
  return {par:0,guesses:gs};
}
// The thief only moves after every SECOND miss: he sits still for guesses 1 and 2, steps, sits still for 3 and 4, steps, then guess 5.
const moveAfter=k=>k%2===1;
function makePath(r){let p=Math.floor(r()*CELLS);const path=[p];for(let k=1;k<MAXG;k++){if(moveAfter(k-1)){const nb=nbrs(p);p=nb[Math.floor(r()*nb.length)]}path.push(p)}return path}
// Retry seeds until the solver catches him within 5 guards. First choice is a day with par 3 to 5 so it is never a freebie.
function genDay(seed){
  let last=null;
  for(let a=0;a<1000;a++){
    const path=makePath(mulberry32(hashStr(seed+'#'+a)));
    const sol=solve(path);
    last={path,par:sol.par,solver:sol.guesses,tries:a+1};
    if(sol.par>0&&(sol.par>=3||a>=100))return last;
  }
  return last;
}
function check(){
  let bad=0;const hist={};
  for(let d=1;d<=60;d++){
    const s='2026-12-'+String(d).padStart(2,'0'),day=genDay(s),p=day.path;
    if(JSON.stringify(genDay(s).path)!==JSON.stringify(p))bad++;
    if(p.length!==MAXG)bad++;
    for(let k=0;k<MAXG;k++){if(!(p[k]>=0&&p[k]<CELLS))bad++;if(k){if(moveAfter(k-1)){if(p[k]===p[k-1]||dist(p[k],p[k-1])!==1)bad++}else if(p[k]!==p[k-1])bad++}}
    const sol=solve(p);
    if(sol.par<1||sol.par>MAXG||sol.par!==day.par)bad++;
    let caught=0;sol.guesses.forEach((g,k)=>{if(!caught&&g===p[k])caught=k+1});
    if(caught!==sol.par)bad++;
    hist[sol.par]=(hist[sol.par]||0)+1;
  }
  console.log('Egg Thief self-check, 60 days, par spread',JSON.stringify(hist),'problems:',bad);
}
check();

// ---------- art ----------
// bubbly letters: each its own colour, rotation and baseline
const PAL=[['#fff4dc','#ff6eb4'],['#ffc93c','#ff7a45'],['#ff6eb4','#fff4dc'],['#3ad6a0','#fff4dc'],['#fff4dc','#3ad6a0'],['#ffc93c','#ff6eb4'],['#ff6eb4','#ffc93c'],['#fff4dc','#ff7a45']];
const ROT=[-7,5,-4,6,-6,4,-5,7],YO=[.03,-.04,.02,-.03,.04,-.02,.03,-.04];
function bub(word,o){o=o||{};let k=o.k||0;return [...word].map(ch=>{
  if(ch===' ')return '<i class="sp"> </i>';
  const p=PAL[k%PAL.length],rot=ROT[k%8],y=YO[k%8];k++;
  const egg=o.egg&&ch===o.egg?'<img class="dot" src="assets/thief.svg" alt="">':'';
  return `<i style="--c:${p[0]};--r:${p[1]};--rot:${rot}deg;--y:${y}em">${ch}${egg}</i>`}).join('')}
$('wm').innerHTML='<div class="lock"><span class="ln l1">'+bub('EGG',{k:0})+'</span><span class="ln l2">'+bub('THIEF',{k:3,egg:'I'})+'</span><span class="ln tag">'+bub('CATCH HIM!',{k:5})+'</span></div>';
$('wm2').innerHTML='<span class="ln">'+bub('EGG THIEF',{k:0,egg:'I'})+'</span>';
const sImg=(f,cls)=>`<img class="${cls||''}" src="assets/${KEY[f].s}.svg" alt="">`;
const FOOT='<img src="assets/footprint.svg" alt="">';
const GRID0='';
$('key').innerHTML=[['Hot',2,'1 step'],['Warm',1,'2'],['Cold',0,'3+'],['Caught',3,'0']].map(([n,f,d])=>`<span class="k">${sImg(f)}${n} ${d}</span>`).join('');

// ---------- game ----------
let seed,practice,day,guesses=[],locked=false;
const fb=k=>col(dist(guesses[k],day.path[k]));
const hasWon=()=>guesses.some((g,k)=>fb(k)===3);
const isOver=()=>hasWon()||guesses.length>=MAXG;
function begin(s,p){
  seed=s;practice=p;locked=false;day=genDay(s);
  const done=!p&&load('et_'+s,null);
  if(done){guesses=done.g;return showCard()}
  guesses=p?[]:load('et_p_'+s,[]);
  show('game');render(-1);
}
function sayHTML(){
  const n=guesses.length;
  if(!n)return '<div class="tx">Tap a nest to post a guard.<small>He steps one nest after every 2nd miss.</small></div>';
  const f=fb(n-1);
  const big=sImg(f,'big');
  if(f===3)return '<div class="tx">Caught him!<small>Guard '+n+' of 5. Cuffs on.</small></div>'+big;
  if(n>=MAXG)return '<div class="tx">He got away.<small>The thief was never where you looked.</small></div>'+big;
  const msg=['Cold. 3 or more steps away.','Warm. 2 steps away.','Hot. 1 step away.'][f];
  return '<div class="tx">'+msg+'<small>'+(moveAfter(n-1)?FOOT+'Then he sneaked one step. ':'He stayed put. ')+'Guard '+(n+1)+' of 5.</small></div>'+big;
}
const DEBUG=false; // TEMP: set true to show where the thief is
function dbg(i){
  if(!DEBUG)return '';
  let s='';
  if(!isOver()&&day.path[guesses.length]===i)s+='<span class="dbg now"><img src="assets/thief.svg" alt="" style="width:60%"></span>';
  day.path.slice(0,guesses.length).forEach((p,k)=>{if(p===i)s+='<span class="trail">he was here at guess '+(k+1)+'</span>'});
  return s;
}
function render(flip){
  $('streak').textContent=load('et_streak',0)?'Streak '+load('et_streak',0):'';
  const over=isOver();
  $('slots').innerHTML=Array.from({length:MAXG},(_,i)=>{
    if(i<guesses.length){const f=fb(i);return `<div class="slot ${KEY[f].k}${i===flip?' stamp':''}" role="img" aria-label="Guard ${i+1}: ${KEY[f].n}">${sImg(f,'bd')}<span class="nc">${i+1}</span></div>`}
    return `<div class="slot ${i===guesses.length&&!over?'now':''}"><span class="nc" style="background:none;color:var(--ink)">${i+1}</span></div>`}).join('');
  let h='';
  for(let i=0;i<CELLS;i++){
    const ks=[];guesses.forEach((g,k)=>{if(g===i)ks.push(k)});
    const r=Math.floor(i/4)+1,c=i%4+1;
    if(!ks.length){h+=`<button class="nest" data-i="${i}" aria-label="Nest row ${r} column ${c}"><img class="n" src="assets/nest.svg" alt="">${dbg(i)}</button>`;continue}
    const last=ks[ks.length-1],f=fb(last);
    h+=`<button class="nest${last===flip?' new':''}" data-i="${i}" aria-label="Nest row ${r} column ${c}, guard ${ks.map(k=>k+1).join(' and ')}, ${KEY[f].n}">${sImg(f,'bd')}<span class="nc">${ks.map(k=>k+1).join('·')}</span>${dbg(i)}</button>`;
  }
  $('grid').innerHTML=h;
  $('say').innerHTML=sayHTML()+(DEBUG?'<div class="tx" style="color:#c00">DEBUG ON: the thief is shown on his current nest.</div>':'');
}
function tap(i){
  if(locked||isOver())return;
  guesses.push(i);
  const k=guesses.length-1,f=fb(k);
  render(k);
  if(f===3){[523,659,784,1047].forEach((q,j)=>setTimeout(()=>tone(q,.18,'triangle',.1),j*90));buzz([40,40,80])}
  else{tone([200,330,520][f],.2,f===2?'square':'triangle',.07,[150,300,640][f]);buzz(f===2?[60,40,60]:f===1?[40]:[20])}
  if(!practice)save('et_p_'+seed,guesses);
  if(isOver()){locked=true;setTimeout(finishAll,1000)}
}
function finishAll(){
  const won=hasWon();
  if(!practice){
    save('et_'+seed,{g:guesses});
    const days=load('et_days',[]);
    if(!days.includes(seed)){days.push(seed);save('et_days',days);
      if(won){const last=load('et_last',''),y=ds(new Date(Date.now()-864e5));save('et_streak',last===y?load('et_streak',0)+1:1);save('et_last',seed)}
      else save('et_streak',0)}
  }
  showCard();
}
function showCard(){
  const n=guesses.length,won=hasWon(),score=won?n:'X';
  const strip=guesses.map((g,k)=>KEY[fb(k)].e).join('');
  show('end');
  $('verdict').innerHTML=won?bub('CAUGHT',{k:3})+'<br>'+bub('HIM!',{k:1}):bub('HE GOT',{k:0})+'<br>'+bub('AWAY!',{k:4});
  $('cdate').textContent=practice?'Practice case':seed;
  $('ctitle').textContent=won?['','Pure luck','Master thief catcher','Good read','Close call','Last guard'][n]:'He got away';
  $('cscore').textContent=score;
  $('rtiles').innerHTML=guesses.map((g,k)=>sImg(fb(k))).join('');
  $('par').innerHTML='His route. Boot prints mark each step he took. Solver par '+day.par+'.';
  $('route').innerHTML=Array.from({length:CELLS},(_,i)=>{const ks=[];day.path.slice(0,n).forEach((p,k)=>{if(p===i)ks.push(k+1)});return ks.length?`<i><img src="assets/footprint.svg" alt=""><b>${ks.join('·')}</b></i>`:'<i></i>'}).join('');
  $('cfine').textContent=practice?'Practice does not count':'Streak '+load('et_streak',0)+' · same thief route for everyone today';
  window._share='Egg Thief '+seed+'\n'+strip+' '+score+'/5';
}
$('play').onclick=()=>begin(today(),false);
$('grid').onclick=e=>{const b=e.target&&e.target.closest&&e.target.closest('button');if(b&&b.dataset&&b.dataset.i!==undefined)tap(+b.dataset.i)};
$('copy').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(window._share):Promise.reject()).then(()=>$('copy').textContent='Copied!',()=>prompt('Copy:',window._share))};
$('prac').onclick=()=>{$('copy').textContent='Copy result';begin('practice-'+Math.random().toString(36).slice(2,7),true)};
addEventListener('error',e=>{const s=$('say');if(s)s.textContent='Error: '+e.message});
$('sfine').textContent=load('et_'+today(),null)?'You have played today. See your result.':(load('et_streak',0)?'Streak '+load('et_streak',0):'New thief route every day');
// test hooks: ?demo=start | game | end | lose  (never touches saved progress)
(function(){
  const m=/[?&]demo=(\w+)/.exec(location.search);if(!m)return;
  seed='demo-day';practice=true;day=genDay(seed);
  if(m[1]==='game'){guesses=[day.solver[0],day.solver[1],(day.path[2]+5)%CELLS];if(fb(2)===3)guesses[2]=(day.path[2]+6)%CELLS;show('game');render(2)}
  else if(m[1]==='end'){guesses=day.solver.slice(0,day.par);showCard()}
  else if(m[1]==='lose'){guesses=[];for(let k=0;k<MAXG;k++)guesses.push((day.path[k]+5)%CELLS);for(let k=0;k<MAXG;k++)if(fb(k)===3)guesses[k]=(day.path[k]+6)%CELLS;showCard()}
})();
</script>
