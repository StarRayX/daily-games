<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Egg Thief</title>
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<style>
@font-face{font-family:"Allo";src:url("../../shared/AlloVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--yolk:#ffb92e;--tint:#ffc957;--ink:#3b2410;--brown:#8a5a2b;--card:#fff6e3;--tile:#f6e5c4;--robin:#9fd8d2;--pink:#ffb3a7;--mint:#3ad6a0;--hot:#ff5a36}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ink);font-family:"Allo",system-ui,sans-serif;font-weight:700;overflow:hidden;touch-action:manipulation;user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:var(--yolk);container-type:inline-size}
section{position:absolute;inset:0;display:none;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
section.on{display:flex}
img{display:block}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* ground: plain egg-yolk, with stripes and quail-egg speckles on a masked layer that shows only in soft random patches */
.gnd{background:var(--yolk)}
.gnd::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(255,255,255,.35) 1.4px,transparent 1.6px) 0 0/14px 14px,repeating-linear-gradient(-35deg,var(--yolk) 0 56px,var(--tint) 56px 112px);-webkit-mask-image:radial-gradient(circle at var(--p0x,12%) var(--p0y,8%),rgba(0,0,0,var(--p0a,.85)) 0,transparent var(--p0r,34%)),radial-gradient(circle at var(--p1x,88%) var(--p1y,28%),rgba(0,0,0,var(--p1a,.85)) 0,transparent var(--p1r,30%)),radial-gradient(circle at var(--p2x,10%) var(--p2y,55%),rgba(0,0,0,var(--p2a,.85)) 0,transparent var(--p2r,32%)),radial-gradient(circle at var(--p3x,90%) var(--p3y,74%),rgba(0,0,0,var(--p3a,.85)) 0,transparent var(--p3r,34%)),radial-gradient(circle at var(--p4x,50%) var(--p4y,96%),rgba(0,0,0,var(--p4a,.85)) 0,transparent var(--p4r,28%));mask-image:radial-gradient(circle at var(--p0x,12%) var(--p0y,8%),rgba(0,0,0,var(--p0a,.85)) 0,transparent var(--p0r,34%)),radial-gradient(circle at var(--p1x,88%) var(--p1y,28%),rgba(0,0,0,var(--p1a,.85)) 0,transparent var(--p1r,30%)),radial-gradient(circle at var(--p2x,10%) var(--p2y,55%),rgba(0,0,0,var(--p2a,.85)) 0,transparent var(--p2r,32%)),radial-gradient(circle at var(--p3x,90%) var(--p3y,74%),rgba(0,0,0,var(--p3a,.85)) 0,transparent var(--p3r,34%)),radial-gradient(circle at var(--p4x,50%) var(--p4y,96%),rgba(0,0,0,var(--p4a,.85)) 0,transparent var(--p4r,28%))}
.gnd>*{position:relative}
/* buttons: black, rectangular */
.btn{border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;font-size:20px;padding:12px 44px;min-height:52px;cursor:pointer}
.btn:active{transform:translateY(2px)}
.link{background:none;border:0;font-weight:800;font-size:16px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:12px 16px;min-height:48px}
/* hand-drawn cards: the fill lives on a pseudo layer that gets a small wobble filter, so text is never distorted */
.hero,.card,.res{position:relative;isolation:isolate}
.hero::before,.card::before,.res::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--card);border-radius:20px;filter:url(#rough)}
.crack::before{border-top-left-radius:3px;border-top-right-radius:3px}
.crack::after{content:"";position:absolute;left:0;right:0;top:-11px;height:18px;z-index:-1;background:var(--card);filter:url(#rough2);clip-path:polygon(0 100%,0 62%,3% 38%,6% 66%,10% 14%,14% 58%,19% 28%,23% 72%,28% 8%,33% 52%,37% 22%,42% 70%,47% 12%,52% 60%,57% 24%,61% 68%,66% 6%,71% 56%,76% 20%,80% 66%,85% 10%,90% 54%,94% 26%,97% 60%,100% 34%,100% 100%)}
/* wordmark: same recipe as Sprout. One line, per letter fill, darker inner stroke, thin em-based outline */
.out{filter:drop-shadow(.045em 0 0 var(--ink)) drop-shadow(-.045em 0 0 var(--ink)) drop-shadow(0 .045em 0 var(--ink)) drop-shadow(0 -.045em 0 var(--ink)) drop-shadow(0 .09em 0 var(--ink))}
.wm{display:flex;align-items:flex-end;justify-content:center;font-size:var(--fs,min(13cqw,60px));line-height:1;padding-top:.3em;margin:0;font-weight:900}
.wm.sm{--fs:44px;padding-top:0}
.wm .L{display:block;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;line-height:.8;color:var(--c);-webkit-text-stroke:.13em var(--s);paint-order:stroke fill;margin:0 -.005em;transform:translateY(var(--y,0)) rotate(var(--r,0deg))}
.wm .gap{display:block;width:.28em}
.wm .o{display:block;position:relative;width:.8em;height:.72em;margin:0 .02em;transform:translateY(var(--y,0)) rotate(var(--r,0deg))}
.wm .o img{position:absolute;left:0;bottom:-.04em;width:.8em;height:.96em;display:block}
.wmw{width:max-content;max-width:100%}
.bb i{display:inline-block;position:relative;font-style:normal;color:var(--c);-webkit-text-stroke:.13em var(--r);paint-order:stroke fill;transform:translateY(var(--y)) rotate(var(--rot));margin:0 -.015em}
.bb i.sp{width:.28em;-webkit-text-stroke:0}
.ln{display:block;white-space:nowrap}
.dot{position:absolute;left:50%;top:-.84em;width:.8em;max-width:none;transform:translateX(-46%) rotate(9deg);-webkit-text-stroke:0}
#start{align-items:center;justify-content:center;text-align:center}
#start .mid{display:flex;flex-direction:column;align-items:center;gap:0;width:100%}
.lock{width:max-content;max-width:100%;display:flex;flex-direction:column}
.lock .l1{align-self:flex-start;font-size:.66em;margin:0 0 .1em -.02em}
.lock .l2{margin-top:.62em}
.tagline{display:block;margin:8px 0 0 38%;color:#fff;font-weight:900;font-size:20px;letter-spacing:.14em;line-height:1;text-transform:uppercase;font-variation-settings:"ROND" 100,"opsz" 32;transform:rotate(-5deg)}
.hero{width:100%;margin-top:34px;padding:22px 18px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.one{margin:0;font-size:19px;line-height:1.3;font-weight:800;max-width:19em;text-wrap:balance}
.rule{margin:0;font-size:15px;line-height:1.3;font-weight:700;text-wrap:balance}
.hero .btn{margin-top:6px}
#sfine{font-size:15px;font-weight:700}
/* play screen: calm */
#game{background:var(--yolk);padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
.card{--bw:min(100%,calc((100dvh - 250px)/1.17))}
.card{flex:0 1 auto;margin:0 0 auto;min-height:0;padding:14px;display:flex;flex-direction:column;gap:12px}
.card header{display:flex;align-items:center;gap:10px}
.card header img{width:40px;height:40px}
.card .nm{font-weight:900;font-size:22px;flex:1;font-variation-settings:"ROND" 100}
#streak{background:var(--yolk);border-radius:9px 11px 10px 12px;padding:5px 11px;font-weight:800;font-size:15px}
#streak:empty{display:none}
#posts{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;align-items:center;width:var(--bw);margin:0 auto}
#posts>img{width:100%;aspect-ratio:1;object-fit:contain;padding:6%}
#slots{display:contents}
.slot{position:relative;aspect-ratio:1;display:grid;place-items:center}
.slot::before,.nest::before{content:"";position:absolute;inset:0;border-radius:12px 9px 11px 10px/10px 12px 9px 11px;background:var(--tile);filter:url(#rough)}
.slot.now::before{background:#ffe3a0}
.nest:nth-child(3n+2)::before{filter:url(#rough2)}
.nest:nth-child(3n)::before{filter:url(#rough3)}
.slot:nth-child(2n)::before{filter:url(#rough2)}
.slot .bd{position:absolute;inset:0;width:100%;height:100%}
.nc{position:absolute;left:2px;top:2px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:var(--card);font-weight:800;font-size:14px;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums;line-height:1}
.slot.stamp,.nest.new .bd{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:.2}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:var(--bw);margin:0 auto}
.nest{position:relative;border:0;background:none;padding:0;aspect-ratio:1;min-height:44px;cursor:pointer;display:block}
.nest>img.n{position:absolute;inset:5%;width:90%;height:90%}
.nest .bd{position:absolute;inset:0;width:100%;height:100%}
.nest:active{transform:scale(.94)}
.nest .gc{position:absolute;right:2px;top:2px;width:30%;height:auto}
.nest .shell{position:absolute;left:0;bottom:0;width:44%;height:auto}
/* direction arrow: cream chip, ink arrow, the chip turns to point from the guard toward the thief */
.ar{position:absolute;left:50%;top:52%;width:58%;margin:-29% 0 0 -29%;aspect-ratio:1;border-radius:46% 54% 50% 50%;background:var(--card);display:grid;place-items:center;transform:rotate(var(--a))}
.ar svg{width:74%;height:74%}
.slot .ar{width:62%;margin:-31% 0 0 -31%}
.ar.in{position:static;margin:0;width:24px;flex:none;background:var(--tile)}
.dbg{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.dbg svg{width:72%;height:auto}
.trail{position:absolute;left:4px;bottom:3px;font-size:14px;font-weight:800;background:var(--ink);color:var(--card);padding:1px 5px;pointer-events:none}
#key{display:flex;gap:12px;align-items:center;justify-content:flex-start;flex-wrap:nowrap;font-weight:700;font-size:13px;line-height:1;white-space:nowrap}
#key .k{display:flex;align-items:center;gap:5px}
#key img{width:22px;height:22px}
#key .ar.in{width:22px}
#say{display:flex;align-items:center;gap:12px;min-height:64px}
#say .tx{flex:1;min-width:0;font-weight:900;font-size:20px;line-height:1.15}
#say .tx small{display:block;font-weight:600;font-size:15px;line-height:1.3;margin-top:4px;color:rgba(59,36,16,.72)}
#say .big{width:60px;height:60px;max-width:none;flex:none;animation:pop .35s ease-out}
/* result: loud again */
#end{overflow-y:auto;align-items:center;gap:12px}
#end .wm.sm{--fs:min(10cqw,44px)}
#end .wm.sm .ln{text-align:center}
#end .bb{--fs:min(15cqw,64px);font-size:var(--fs);font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;line-height:.95;text-transform:uppercase;text-align:center;transform:rotate(-3deg);margin:6px 0 4px;
 filter:drop-shadow(.055em 0 0 var(--ink)) drop-shadow(-.055em 0 0 var(--ink)) drop-shadow(0 .055em 0 var(--ink)) drop-shadow(0 -.055em 0 var(--ink)) drop-shadow(0 .09em 0 var(--ink))}
.res{width:100%;margin-top:6px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:none}
.res{align-items:center;text-align:center}
.res .head{display:flex;align-items:center;justify-content:center;gap:14px}
.res .head>div:nth-child(2){text-align:left}
.res .head img{width:56px;height:auto;flex:none}
#cdate{font-size:14px;font-weight:700}
#ctitle{font-weight:900;font-size:22px;line-height:1.1}
.score{white-space:nowrap;display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;margin-left:6px}
.score b{font-size:56px;line-height:.9;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32}
.score span{font-size:22px;font-weight:800}
.hist{display:flex;gap:8px;justify-content:center}
.ht{position:relative;flex:1;min-width:0;max-width:50px;aspect-ratio:1}
.ht img{position:absolute;inset:0;width:100%;height:100%}
.rr{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.route{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;width:min(100%,240px);flex:none}
.route i{aspect-ratio:1;background:var(--tile);border-radius:10px 8px 11px 9px/9px 11px 8px 10px;position:relative;font-style:normal;display:grid;place-items:center}
.route i img{width:50%;margin-top:-10px}
.route i u{position:absolute;left:0;right:0;bottom:2px;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;text-decoration:none}
.route i b{min-width:16px;height:16px;border-radius:8px;background:var(--ink);color:var(--card);font-size:11px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums;line-height:1}
.rr p{margin:0;font-size:15px;line-height:1.35;font-weight:700;color:rgba(59,36,16,.72);text-align:center}
#end .act{display:flex;flex-direction:column;align-items:center;gap:8px}
#cfine{font-size:15px;font-weight:700;text-align:center}
@media (max-width:400px){.one{font-size:18px}.btn{padding:12px 36px}}
@media (max-height:700px){#say{min-height:56px}#say .big{width:52px;height:52px}.card{gap:8px;padding:12px;--bw:min(100%,calc((100dvh - 215px)/1.17))}}
@media (max-width:380px){#key{gap:8px;font-size:12px}#key img,#key .ar.in{width:18px}#say .tx{font-size:18px}#say .tx small{font-size:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="rough2" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="21" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="rough3" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<div id="app">
  <section id="start" class="on gnd">
    <div class="mid">
      <div class="wmw"><h1 class="wm out" id="wm" aria-label="Egg Thief. Catch him!"></h1><div class="tagline" aria-hidden="true">Catch him!</div></div>
      <div class="hero crack">
        <p class="one">A thief hides on one of 36 nests. Post up to 5 guards. Each one says which way he is: up, down, left or right.</p>
        <p class="rule">After each miss he runs one nest straight away from your guard.</p>
        <button class="btn" id="play">Play</button>
        <div id="sfine"></div>
      </div>
    </div>
  </section>

  <section id="game">
    <div class="card">
      <header><img src="assets/mark.svg" alt=""><div class="nm">Egg Thief</div><div id="streak"></div></header>
      <div id="posts" aria-label="Your guards"><img src="assets/guard.svg" alt="Guard"><div id="slots"></div></div>
      <div id="grid" aria-label="Nests"></div>
      <div id="say"></div>
      <div id="key" aria-label="Key"></div>
    </div>
  </section>

  <section id="end" class="gnd">
    <h2 class="wm out sm" id="wm2" style="margin-top:36px" aria-label="Egg Thief"></h2>
    <div class="bb" id="verdict"></div>
    <div class="res crack">
      <div class="head"><img src="assets/thief.svg" alt=""><div><div id="cdate"></div><div id="ctitle"></div></div><div class="score"><b id="cscore"></b><span>/ 5</span></div></div>
      <div class="hist" id="rtiles" aria-label="Result"></div>
      <div class="rr"><div class="route" id="route" aria-label="His route"></div><p id="par"></p></div>
      </div>
    <div class="act"><button class="btn" id="copy">Copy result</button><div id="cfine"></div><button class="link" id="prac">Practice case</button></div>
  </section>
</div>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const $=id=>document.getElementById(id);
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ds(new Date())}
function load(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* ground speckles: small irregular quail-egg flecks in speckled brown, seeded so they never jump */
(function(){const r=mulberry32(2718),f=[];for(let i=0;i<34;i++){const x=(r()*150).toFixed(1),y=(r()*150).toFixed(1),big=r()<.35,rx=(big?3.4+r()*2.6:1.6+r()*1.8).toFixed(1),ry=(big?2.2+r()*2:1.1+r()*1.4).toFixed(1),rot=Math.round(r()*180),op=(.4+r()*.35).toFixed(2);f.push(`<ellipse cx='${x}' cy='${y}' rx='${rx}' ry='${ry}' transform='rotate(${rot} ${x} ${y})' fill-opacity='${op}'/>`)}
const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><g fill='#8a5a2b'>${f.join('')}</g></svg>`;document.documentElement.style.setProperty('--speck','url("data:image/svg+xml,'+encodeURIComponent(svg)+'")')})();
/* ground pattern patches: 5 soft spots, random per page load, edges favoured so the pattern fades behind text and card */
(function(){const R=Math.random,e=document.querySelectorAll(".gnd"),v={};for(let i=0;i<5;i++){const left=i%2===0;v["--p"+i+"x"]=Math.round(left?R()*28:72+R()*28)+"%";v["--p"+i+"y"]=Math.round(i*22+R()*14-2)+"%";v["--p"+i+"a"]=(.7+R()*.3).toFixed(2);v["--p"+i+"r"]=Math.round(26+R()*16)+"%"}e.forEach(n=>{for(const k in v)n.style.setProperty(k,v[k])})})();
function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('on',s===id))}
let ac;function tone(f,d,type,vol,slide){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,ac.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);g.gain.setValueAtTime(vol||.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ---------- the board ----------
// Rules: each guard reports a distance band (hot 1, warm 2, cold 3+, caught 0; Manhattan) and the compass direction from the
// guard to the thief. After every miss the thief runs one nest straight away from that guard. A cracked shell marks the
// nest he stood on one guard ago. Everything is deterministic, so a day is just his starting nest.
const N=6,MAXG=5,CELLS=N*N;
const R_=i=>Math.floor(i/N),C_=i=>i%N;
const dist=(a,b)=>Math.abs(R_(a)-R_(b))+Math.abs(C_(a)-C_(b));
function nbrs(i){const r=R_(i),c=C_(i),o=[];if(r>0)o.push(i-N);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);if(c<N-1)o.push(i+1);return o}
// 4-way arrow: the axis where he is farther from the guard (vertical if equal). Index 0 north, 2 east, 4 south, 6 west.
const SHELL_FROM=3; // the shell shows from the 3rd guard on
const DIRN=['north','','east','','south','','west',''];
const DIRE=['⬆️','','➡️','','⬇️','','⬅️',''];
const dirOf=(g,t)=>{const dr=R_(t)-R_(g),dc=C_(t)-C_(g);return Math.abs(dr)>=Math.abs(dc)?(dr<0?0:4):(dc>0?2:6)};
const cmpK=(a,b)=>{for(let i=0;i<a.length;i++)if(a[i]!==b[i])return a[i]-b[i];return 0};
// Flee rule: one nest up, down, left or right, whichever is farthest from the guard. Tie: the axis where he is already
// farther from the guard (vertical if equal). Still tied at a wall: toward the middle, then lowest nest number.
// If no neighbour is farther away he is cornered and stays put.
function flee(g,t){
  const d0=dist(g,t),vFirst=Math.abs(R_(t)-R_(g))>=Math.abs(C_(t)-C_(g));
  let best=t,bk=null;
  for(const n of nbrs(t)){const d=dist(g,n);if(d<=d0)continue;
    const k=[d,(R_(n)!==R_(t))===vFirst?1:0,-(Math.abs(R_(n)-(N-1)/2)+Math.abs(C_(n)-(N-1)/2)),-n];
    if(!bk||cmpK(k,bk)>0){best=n;bk=k}}
  return best;
}
// positions of the thief when each guard is posted: p[j] is where he stands when guard j lands
function simPos(s0,gs){const p=[s0];for(let j=0;j<gs.length;j++)p.push(p[j]===gs[j]?p[j]:flee(gs[j],p[j]));return p}
// one report as the player sees it: the 4-way arrow only (plus the shell from the third guard on)
const fkey=(g,t)=>g===t?'win':''+dirOf(g,t);
// Belief-set players. Each tracks every starting nest still consistent with all reports so far under the flee rule.
// optPick posts the guard that leaves the fewest survivors (sum of squared class sizes).
const optPick=(cur,k)=>{let bg=-1,bs=1e9;
  for(let g=0;g<CELLS;g++){const m={};let ca=0;
    cur.forEach(p=>{if(p[k]===g){ca++;return}const key=fkey(g,p[k])+'|'+(k>=SHELL_FROM-1?p[k-1]:'-');m[key]=(m[key]||0)+1});
    let s=0;for(const q in m)s+=m[q]*m[q];s-=ca*.01;if(s<bs-1e-9){bs=s;bg=g}}
  return bg};
// Greedy player: ignores that he runs. Taps the middle of the nests that fit the latest arrow only.
function greedyPlay(s0){let t=s0,last=null;
  for(let k=0;k<MAXG;k++){
    const cand=Array.from({length:CELLS},(_,i)=>i).filter(c=>!last||(c!==last[0]&&dirOf(last[0],c)===last[1]));
    const mr=cand.reduce((a,c)=>a+R_(c),0)/cand.length,mc=cand.reduce((a,c)=>a+C_(c),0)/cand.length;
    let g=0,bd=1e9;for(let x=0;x<CELLS;x++){const d=(R_(x)-mr)**2+(C_(x)-mc)**2;if(d<bd-1e-9){bd=d;g=x}}
    if(g===t)return k+1;last=[g,dirOf(g,t)];t=flee(g,t)}
  return 0}
function playOut(s0,pick){
  let C=Array.from({length:CELLS},(_,i)=>i);const gs=[],sizes=[];let ok=true;
  for(let k=0;k<MAXG;k++){
    const g=pick(C.map(s=>simPos(s,gs)),k);gs.push(g);
    const tp=simPos(s0,gs),t=tp[k];
    if(t===g)return {par:k+1,guesses:gs,ok,sizes};
    const key=fkey(g,t)+'|'+(k>=SHELL_FROM-1?tp[k-1]:'-');
    C=C.filter(s=>{const p=simPos(s,gs);return p[k]!==g&&fkey(g,p[k])+'|'+(k>=SHELL_FROM-1?p[k-1]:'-')===key});
    if(!C.includes(s0))ok=false;
    sizes.push(C.length);
  }
  return {par:0,guesses:gs,ok,sizes};

const solve=s0=>playOut(s0,optPick);
const PARS=Array.from({length:CELLS},(_,s)=>solve(s));
// A day is a seeded pick of starting nest. Preference: solver par 3 or 4, then 5, then 2. Never par 1 (a freebie).
function genDay(seed){
  const r=mulberry32(hashStr(seed+'#v3')),order=Array.from({length:CELLS},(_,i)=>i);
  for(let i=CELLS-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  for(const tier of [[3,4],[5],[2]]){const s=order.find(x=>tier.includes(PARS[x].par));if(s!==undefined)return {start:s,par:PARS[s].par,solver:PARS[s].guesses}}
  const s=order.find(x=>PARS[x].par>0);return {start:s,par:PARS[s].par,solver:PARS[s].guesses};
}
function check(){
  let bad=0;const hist={},gh={},byStart={},bel=[0,0,0],beln=[0,0,0];
  for(let g=0;g<CELLS;g++)for(let t=0;t<CELLS;t++){if(g===t)continue;const n=flee(g,t),moved=n!==t;
    if(moved&&(!nbrs(t).includes(n)||dist(g,n)<=dist(g,t)))bad++;
    if(!moved&&nbrs(t).some(x=>dist(g,x)>dist(g,t)))bad++;
    if(moved&&nbrs(t).some(x=>dist(g,x)>dist(g,n)))bad++}
  PARS.forEach((p,s)=>{byStart[p.par]=(byStart[p.par]||0)+1;if(!p.ok||p.par<1||p.par>MAXG)bad++;p.sizes.forEach((z,i)=>{if(i<3){bel[i]+=z;beln[i]++}})});
  for(let d=1;d<=60;d++){
    const s='2026-12-'+String(d).padStart(2,'0'),day=genDay(s);
    if(JSON.stringify(genDay(s))!==JSON.stringify(day))bad++;
    if(!(day.start>=0&&day.start<CELLS))bad++;
    const sol=solve(day.start);
    if(!sol.ok||sol.par<2||sol.par>MAXG||sol.par!==day.par)bad++;
    const p=simPos(day.start,day.solver);let caught=0;day.solver.forEach((g,k)=>{if(!caught&&g===p[k])caught=k+1});
    if(caught!==sol.par)bad++;
    hist[sol.par]=(hist[sol.par]||0)+1;
    const gp=greedyPlay(day.start);gh[gp||'fail']=(gh[gp||'fail']||0)+1;
  }
  console.log('Egg Thief self-check, 60 days, solver par spread',JSON.stringify(hist),'| greedy middle-tapper (ignores his running)',JSON.stringify(gh),'| par over all 36 starts',JSON.stringify(byStart),'| avg nests left after clue 1/2/3',(bel[0]/beln[0]).toFixed(1),(bel[1]/Math.max(1,beln[1])).toFixed(1),(bel[2]/Math.max(1,beln[2])).toFixed(1),'| problems:',bad);
}

function sayHTML(){

const DEBUG=false; // TEMP: set true to show where the thief is
function dbg(i){

}
function render(flip){

function tap(i){

  guesses.push(i);sync();
  const k=guesses.length-1,w=won_(k);
  render(k);
  if(w){[523,659,784,1047].forEach((q,j)=>setTimeout(()=>tone(q,.18,'triangle',.1),j*90));buzz([40,40,80])}

<script>
/* Hand-cut corners v2: rough, hand-torn edges drawn as a vector clip-path outline (crisp at any pixel density, no filters). */
(function(){
  var st=document.createElement("style");st.textContent="[data-hp=b]::before{clip-path:var(--hcp);-webkit-clip-path:var(--hcp)}[data-hp=a]::after{clip-path:var(--hcp);-webkit-clip-path:var(--hcp)}";document.head.appendChild(st);
  var n=0;
  function R(seed){var x=Math.sin(seed*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
  function outline(w,h,r,seed){
    // walk the perimeter of a rounded rectangle, sampling about every 5px, pushing each point in or out a little
    r=Math.min(r,w/2-1,h/2-1);
    var pts=[],step=5,amp=Math.max(1.6,Math.min(3.6,Math.min(w,h)*.055));
    var segs=[[r,0,w-r,0],[w,r,w,h-r],[w-r,h,r,h],[0,h-r,0,r]];
    var corners=[[w-r,r,-Math.PI/2],[w-r,h-r,0],[r,h-r,Math.PI/2],[r,r,Math.PI]];
    var k=0;
    for(var s=0;s<4;s++){
      var a=segs[s],len=Math.hypot(a[2]-a[0],a[3]-a[1]),m=Math.max(2,Math.round(len/step));
      var nx=[0,1,0,-1][s],ny=[-1,0,1,0][s];
      for(var i=0;i<m;i++){var t=i/m,x=a[0]+(a[2]-a[0])*t,y=a[1]+(a[3]-a[1])*t;
        var d=(Math.sin(k*.7+seed)*.45+ (R(seed*31+k)-.5)*1.1)*amp;k++;
        pts.push([x+nx*d,y+ny*d])}
      var c=corners[s],cm=Math.max(3,Math.round(r*1.57/step));
      for(var j=0;j<cm;j++){var an=c[2]+(Math.PI/2)*(j/cm),d2=(R(seed*17+k)-.5)*1.1*amp;k++;
        pts.push([c[0]+Math.cos(an)*(r+d2),c[1]+Math.sin(an)*(r+d2)])}
    }
    // smooth through midpoints so the wobble reads as a cut edge, not a zigzag
    var p='M'+((pts[0][0]+pts[1][0])/2).toFixed(1)+' '+((pts[0][1]+pts[1][1])/2).toFixed(1);
    for(var q=1;q<=pts.length;q++){var A=pts[q%pts.length],B=pts[(q+1)%pts.length];
      p+=' Q'+A[0].toFixed(1)+' '+A[1].toFixed(1)+' '+((A[0]+B[0])/2).toFixed(1)+' '+((A[1]+B[1])/2).toFixed(1)}
    return p+'Z';
  }
  function shape(el){
    if(!el.dataset)return;var cs=getComputedStyle(el);
    var r=parseFloat(cs.borderTopLeftRadius)||0;
    var pseudo="";
    if(r<4){var pb=getComputedStyle(el,"::before"),pa=getComputedStyle(el,"::after");
      if(pb.content&&pb.content!=="none"&&pb.position==="absolute"&&(parseFloat(pb.borderTopLeftRadius)||0)>=4){r=parseFloat(pb.borderTopLeftRadius);pseudo="b"}
      else if(pa.content&&pa.content!=="none"&&pa.position==="absolute"&&(parseFloat(pa.borderTopLeftRadius)||0)>=4){r=parseFloat(pa.borderTopLeftRadius);pseudo="a"}}
    if(r<4||r>=999)return;
    var w=el.offsetWidth,h=el.offsetHeight;if(!w||!h)return;
    if(r>=Math.min(w,h)/2-1)return; // circles stay circles
    var key=w+'x'+h;if(el.dataset.hc===key)return;
    if(!el.dataset.hs){n++;el.dataset.hs=n}
    el.dataset.hc=key;
    var path=outline(w,h,r,+el.dataset.hs);
    var cp="path('"+path+"')";
    if(pseudo){el.dataset.hp=pseudo;el.style.setProperty("--hcp",cp);return}
    // never clip something that has a badge or chip hanging over its edge: leave those smooth
    var b=el.getBoundingClientRect(),over=false;el.querySelectorAll("*").forEach(function(c){var q=c.getBoundingClientRect();if(q.width&&(q.left<b.left-1||q.top<b.top-1||q.right>b.right+1||q.bottom>b.bottom+1))over=true});
    if(over)return;
    el.style.clipPath=cp;el.style.webkitClipPath=cp;
  }
  function all(root){if(root.querySelectorAll)root.querySelectorAll('*').forEach(shape)}
  function go(){all(document.body);
    new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(nd){if(nd.nodeType===1){shape(nd);all(nd)}})})}).observe(document.body,{childList:true,subtree:true});

    addEventListener('resize',function(){all(document.body)})}

})();
</script>
