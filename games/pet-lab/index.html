<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pet Lab</title>
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<style>
@font-face{font-family:"Allo";src:url("../../shared/AlloVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--pink:#ff6fbf;--pink2:#ff86c9;--ink:#5a0036;--cream:#fff6ea;--card:#fffaf0;--lime:#b6f03a;--sky:#4cb6ff;--sun:#ffc93c;--mute:#7a3a5e;--empty:#f3e5cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#3d0025;color:var(--ink);font-family:"Allo",system-ui,sans-serif;font-weight:700;font-variation-settings:"ROND" 40,"opsz" 16;overflow:hidden;touch-action:manipulation;user-select:none}
#app{position:relative;max-width:460px;height:100%;margin:0 auto;overflow:hidden;background:var(--pink)}
section{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:12px 10px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;gap:12px}
section.on{display:flex}
.ground{background:var(--pink);isolation:isolate}
.ground::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(rgba(255,255,255,.3) 1.6px,transparent 2.2px) 0 0/16px 16px,repeating-linear-gradient(150deg,var(--pink) 0 58px,var(--pink2) 58px 116px);-webkit-mask-image:radial-gradient(circle at var(--p0x,12%) var(--p0y,8%),rgba(0,0,0,var(--p0a,.85)) 0,transparent var(--p0r,19%)),radial-gradient(circle at var(--p1x,88%) var(--p1y,28%),rgba(0,0,0,var(--p1a,.85)) 0,transparent var(--p1r,17%)),radial-gradient(circle at var(--p2x,10%) var(--p2y,55%),rgba(0,0,0,var(--p2a,.85)) 0,transparent var(--p2r,18%)),radial-gradient(circle at var(--p3x,90%) var(--p3y,74%),rgba(0,0,0,var(--p3a,.85)) 0,transparent var(--p3r,19%)),radial-gradient(circle at var(--p4x,50%) var(--p4y,96%),rgba(0,0,0,var(--p4a,.85)) 0,transparent var(--p4r,15%));mask-image:radial-gradient(circle at var(--p0x,12%) var(--p0y,8%),rgba(0,0,0,var(--p0a,.85)) 0,transparent var(--p0r,19%)),radial-gradient(circle at var(--p1x,88%) var(--p1y,28%),rgba(0,0,0,var(--p1a,.85)) 0,transparent var(--p1r,17%)),radial-gradient(circle at var(--p2x,10%) var(--p2y,55%),rgba(0,0,0,var(--p2a,.85)) 0,transparent var(--p2r,18%)),radial-gradient(circle at var(--p3x,90%) var(--p3y,74%),rgba(0,0,0,var(--p3a,.85)) 0,transparent var(--p3r,19%)),radial-gradient(circle at var(--p4x,50%) var(--p4y,96%),rgba(0,0,0,var(--p4a,.85)) 0,transparent var(--p4r,15%))}
img{display:block;-webkit-user-drag:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.small{font-size:14px;font-weight:700;color:var(--ink)}
.btn{border:0;background:#111;color:#fff;font-weight:800;font-size:19px;min-height:52px;padding:0 34px;border-radius:10px;cursor:pointer;flex:none;font-variation-settings:"ROND" 40,"opsz" 16}
.btn.wide{width:100%}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.link{background:none;border:0;font-weight:800;font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:12px;min-height:48px}
.out{filter:drop-shadow(.045em 0 0 var(--ink)) drop-shadow(-.045em 0 0 var(--ink)) drop-shadow(0 .045em 0 var(--ink)) drop-shadow(0 -.045em 0 var(--ink)) drop-shadow(0 .09em 0 var(--ink))}
.wm{display:flex;align-items:flex-end;justify-content:center;font-size:var(--fs,min(16vw,72px));line-height:1;padding-top:.3em}
.wm .L{display:block;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;line-height:.8;color:var(--c);-webkit-text-stroke:.13em var(--s);paint-order:stroke fill;margin:0 -.005em;transform:translateY(var(--y,0)) rotate(var(--r,0deg))}
.wm .gap{display:block;width:.28em}
.wm .o{display:block;position:relative;width:1em;height:.72em;margin:0 .04em 0 .02em;transform:translateY(var(--y,0)) rotate(var(--r,0deg))}
.wm .o svg{position:absolute;left:0;bottom:-.04em;width:1em;height:1em;overflow:visible}
.wmw{display:flex;flex-direction:column;align-items:center}
.tg{display:block;font-size:20px;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;letter-spacing:.14em;line-height:1;color:#fff;transform:rotate(-5deg);margin:0}

/* sprites */
.ing{position:absolute;inset:4px;display:block}
.ing>.sp{position:absolute;inset:0;width:100%;height:100%}
.ing>.wb{position:absolute;left:-12px;top:-12px;width:20px;height:20px;z-index:2}
.ing.w>.sp{animation:wig 1.1s ease-in-out infinite;transform-origin:50% 80%}
@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
/* tiles */
.t,.pb,.keyrow i,.sticker{position:relative;--cc:var(--c,var(--empty))}
.keyrow i::before{filter:url(#rough2)}
.t::before,.pb::before,.keyrow i::before,.sticker::before{content:"";position:absolute;inset:0;background:var(--cc);border-radius:var(--rr,10px 12px 9px 11px);filter:url(#rough);z-index:0}
.t{width:46px;height:46px;flex:none}
.t:nth-child(even){--rr:12px 9px 11px 10px}
.t:nth-child(3n){--rr:9px 11px 12px 10px}
.t.e{--c:var(--empty)}
.t.s-green{--c:#2fc45a}.t.s-yellow{--c:#ffc93c}.t.s-grey{--c:#d3cad9}
.t .mk{position:absolute;right:-8px;bottom:-8px;width:21px;height:21px;z-index:2}
.t.flip{animation:flip .55s ease var(--d,0s) both}
@keyframes flip{0%{transform:rotateX(0);--cc:var(--empty)}49%{transform:rotateX(90deg);--cc:var(--empty)}50%{--cc:var(--c)}100%{transform:rotateX(0);--cc:var(--c)}}
.t.flip .mk{animation:mkin .55s steps(1) var(--d,0s) both}
@keyframes mkin{0%,49%{opacity:0}50%,100%{opacity:1}}
.t.flip.mv .ing>.sp{animation:slide .45s ease both}
@keyframes slide{from{transform:translateX(calc(var(--dx) * 100% + var(--dx) * var(--hg)))}to{transform:none}}
/* start */
#start{justify-content:center;gap:18px;text-align:center}
#start .wmw{margin-bottom:22px}
#start .tg{margin:8px 0 0 38%}
.lead{margin:0;max-width:330px;text-wrap:balance;font-size:21px;font-weight:800;line-height:1.25}
/* game */
#game{background:var(--pink);gap:10px}
.gh{display:flex;width:100%;justify-content:space-between;align-items:center;flex:none;padding:0 4px}
.gh .nm{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;font-variation-settings:"ROND" 100,"opsz" 24}
.gh img{width:34px;height:34px}
#streak{font-weight:800;font-size:15px}
.card{width:100%;background:var(--card);border-radius:22px;padding:14px 14px 16px;display:flex;flex-direction:column;align-items:stretch;gap:10px;flex:none}
.lab{font-size:15px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
#hist,#rtab{--ts:52px;--hg:8px}
#hist{width:100%;display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:20px repeat(3,minmax(0,1fr)) 104px;column-gap:var(--hg);align-items:center;min-height:var(--ts)}
.hrow .t{width:auto;height:var(--ts)}
.hrow.em{min-height:0}
.hrow.em .t{height:26px}
.hrow.em .rn{font-size:14px}
.rn{font-weight:900;font-size:17px;text-align:left}
.nt{white-space:nowrap;font-size:14px;font-weight:700;line-height:1.2;text-align:right;justify-self:end}
#say{width:100%;font-weight:900;font-size:20px;line-height:1.2;text-align:left;border-top:3px solid var(--empty);padding-top:10px}
#say small{display:block;margin-top:3px;font-weight:600;font-size:15px;color:var(--mute);line-height:1.3}
.potwrap{position:relative;width:100%;max-width:340px;align-self:center;margin:-12px 0 -4px;aspect-ratio:360/200;flex:none}
.potimg{position:absolute;inset:0;width:100%;height:100%}
.bub{position:absolute;left:0;right:0;top:0;height:30%;pointer-events:none}
.bub i{position:absolute;bottom:0;width:14px;height:14px;border-radius:50%;background:var(--cream);animation:bub 2.8s ease-in infinite;opacity:0}
.bub i:nth-child(1){left:34%}
.bub i:nth-child(2){left:62%;animation-delay:1s;width:11px;height:11px}
.bub i:nth-child(3){left:49%;animation-delay:1.9s;width:9px;height:9px}
@keyframes bub{0%{transform:translateY(14px) scale(.5);opacity:0}25%{opacity:1}100%{transform:translateY(-26px) scale(1.1);opacity:0}}
#pot{position:absolute;inset:0}
.slot{position:absolute;top:33%;width:16.4%;aspect-ratio:1;min-width:48px;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent;padding:0;cursor:pointer}
.slot:nth-child(1){left:24.4%}.slot:nth-child(2){left:50%}.slot:nth-child(3){left:75.6%}
.slot .ing{inset:9%}
.slot .ing>.wb{left:-8px;top:-8px}
.slot.now{background:rgba(255,111,191,.5)}
.slot:active{transform:translate(-50%,-50%) scale(.94)}
#pal{width:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.pb{min-width:0;aspect-ratio:1/1.08;border:0;padding:0;cursor:pointer;background:none}
.pb:active{transform:translateY(2px)}
.pb .ing{inset:7%}
.pb .ing>.wb{left:-9px;top:-9px;width:18px;height:18px}
.keyrow{width:100%;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;font-size:14px;font-weight:700}
.keyrow span{display:flex;align-items:center;gap:6px}
.keyrow i{display:block;width:20px;height:20px;--rr:6px 7px 5px 7px}
.keyrow i img{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px}
/* hatch */
#hatch{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20}
.hv{width:min(64vw,260px);height:min(64vw,260px);display:block;overflow:visible}
.hm{font-size:46px;line-height:1;font-family:"Allo",system-ui,sans-serif;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;filter:drop-shadow(.05em 0 0 #5a0036) drop-shadow(-.05em 0 0 #5a0036) drop-shadow(0 .05em 0 #5a0036) drop-shadow(0 -.05em 0 #5a0036) drop-shadow(.036em .036em 0 #5a0036) drop-shadow(-.036em -.036em 0 #5a0036) drop-shadow(.036em -.036em 0 #5a0036) drop-shadow(-.036em .036em 0 #5a0036) drop-shadow(0 .09em 0 #5a0036)}
.egg{transform-box:fill-box;transform-origin:50% 90%;animation:shake .75s ease both}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg)}35%{transform:rotate(8deg)}55%{transform:rotate(-7deg)}75%{transform:rotate(6deg)}}
.et,.eb{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
.et{animation:flyu .5s ease .8s both}
.eb{animation:flyd .5s ease .8s both}
@keyframes flyu{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(-18px,-40px) rotate(-26deg)}}
@keyframes flyd{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(12px,16px) rotate(10deg)}}
.ckl{opacity:0;animation:ckl 1.1s both}
@keyframes ckl{0%{opacity:0}20%{opacity:1}65%{opacity:1}100%{opacity:0}}
.pet{transform-box:fill-box;transform-origin:50% 100%;animation:pop .6s cubic-bezier(.3,1.6,.5,1) 1.05s both}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
/* result */
#end{gap:10px;padding-top:14px}
#end .wmw{--fs:48px;margin-bottom:6px}
#end .tg{font-size:14px;margin-top:8px}
#cdate{font-size:15px;font-weight:800;margin-top:-4px}
.rtop{display:flex;align-items:center;justify-content:center;gap:22px;width:100%;flex:none}
.sticker{position:relative;width:min(34vw,148px);aspect-ratio:1;display:grid;place-items:center;flex:none;--c:var(--sun);--rr:48% 52% 50% 50%/52% 47% 53% 48%}
.sticker .pv{position:relative;width:82%;height:82%;display:block}
.scorebox{text-align:center}
#cscore{font-size:min(24vw,104px);line-height:.9;font-family:"Allo",system-ui,sans-serif;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;color:var(--ink)}
.of{font-size:19px;font-weight:900;margin-top:14px}
.ctitle{font-size:22px;font-weight:900;text-align:center;line-height:1.15}
.ctitle small{display:block;margin-top:3px;font-size:15px;font-weight:700}
.card.res{gap:12px}
#recipe{display:flex;gap:8px;justify-content:center;--ts:52px}
#recipe .t{width:var(--ts);height:var(--ts)}
.card.res .lab{text-align:center}
#par{text-align:center;opacity:.8}
#rtab{width:100%;display:flex;flex-direction:column;gap:7px}
#end .btn{min-width:200px}
.endbtns{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;flex:none}
@media (max-width:400px){#hist,#rtab{--ts:46px;--hg:6px}#recipe{--ts:46px}.keyrow{gap:6px 10px;font-size:13px}.keyrow span{gap:4px}}
@media (max-height:700px){#hist,#rtab{--ts:44px}#recipe{--ts:44px}.hrow.em .t{height:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><filter id="rough" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="0"/></filter><filter id="rough2" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="0"/></filter></defs></svg>
<div id="app">
  <section id="start" class="ground on">
    <div class="wmw" id="wm1" role="img" aria-label="Pet Lab"></div>
    <p class="lead">Guess the hidden 3-ingredient recipe in 6 mixes. Hatch a pet.</p>
    <button class="btn" id="play">Play</button>
    <div class="small" id="sfine"></div>
  </section>

  <section id="game">
    <header class="gh"><div class="nm"><img src="assets/mark.svg" alt="">Pet Lab</div><div id="streak"></div></header>
    <div class="card">
      <div class="lab" id="mixn"></div>
      <div id="hist" aria-label="Your mixes"></div>
      <div class="keyrow"><span><i style="--c:#2fc45a"><img src="assets/mark-tick.svg" alt=""></i>Right slot</span><span><i style="--c:#ffc21f"><img src="assets/mark-swap.svg" alt=""></i>Wrong slot</span><span><i style="--c:#cfc6d6"><img src="assets/mark-none.svg" alt=""></i>Not in it</span></div>
      <div id="say"></div>
      <div class="potwrap"><img class="potimg" src="assets/pot.svg" alt=""><div class="bub"><i></i><i></i><i></i></div><div id="pot" aria-label="Mixing pot"></div></div>
      <div id="pal" aria-label="Ingredients"></div>
      <button class="btn wide" id="mix">Mix</button>
    </div>
    <div id="hatch" class="ground"></div>
  </section>

  <section id="end" class="ground">
    <div class="wmw" id="wm2" role="img" aria-label="Pet Lab"></div>
    <div class="small" id="cdate"></div>
    <div class="rtop">
      <div class="sticker" id="pet"></div>
      <div class="scorebox"><div id="cscore"></div><div class="of">of 6</div></div>
    </div>
    <div class="ctitle"><span id="ctitle"></span><small id="capn"></small></div>
    <div class="card res">
      <div class="lab">Today's recipe</div>
      <div id="recipe" aria-label="Today's recipe"></div>
      <div class="small" id="par"></div>
      <div id="rtab" aria-label="Result"></div>
    </div>
    <div class="endbtns">
      <button class="btn" id="copy">Copy result</button>
      <div class="small" id="cfine"></div>
      <button class="link" id="prac">Try a practice day</button>
    </div>
  </section>
</div>
<script>
var CREAM='#fff6ea';
// egg with a pet peeking out of the crack. st = ring colour, used only inside the wordmark where every letter has a ring
function eggCracked(st){
 var S=st?' stroke="'+st+'" stroke-width="4" stroke-linejoin="round"':'';
 return '<g filter="url(#rough)"><path d="M30 41L26 19L43 30ZM70 41L75 20L58 30Z" fill="#b6f03a"'+S+'/>'
 +'<path d="M50 21C64 21 76 32 75 46C74 60 63 70 49 70C36 70 25 59 25 46C25 32 37 21 50 21Z" fill="#b6f03a"'+S+'/>'
 +'<circle cx="41" cy="42" r="3.6" fill="#5a0036"/><circle cx="59" cy="43" r="3.6" fill="#5a0036"/>'
 +'<path d="M12 64L25 52L38 66L50 52L62 66L75 52L88 64C90 90 74 98 50 98C26 98 10 90 12 64Z" fill="#fff6ea"'+S+'/>'
 +'<circle cx="30" cy="82" r="5.5" fill="#4cb6ff"/><circle cx="66" cy="86" r="4.5" fill="#4cb6ff"/><circle cx="52" cy="76" r="3.2" fill="#4cb6ff"/></g>';
}
function eggWhole(){
 return '<g filter="url(#rough)"><path d="M50 6C72 6 89 34 88 60C87 84 72 96 50 96C28 96 12 84 12 60C12 34 28 6 50 6Z" fill="#fff6ea"/>'
 +'<circle cx="36" cy="40" r="6" fill="#4cb6ff"/><circle cx="62" cy="34" r="4.5" fill="#ff6fbf"/><circle cx="58" cy="64" r="7" fill="#4cb6ff"/><circle cx="34" cy="72" r="4" fill="#ff6fbf"/></g>';
}
// pet bodies: a body, b belly, c extras (ears, feet, tail). Flat fills, two dot eyes, no mouth.
var PET_NAMES=['kitty','bean','puff','bunny'];
var PET_BODY=[
 function(a,b,c){return '<path d="M80 76C97 76 97 56 91 47" fill="none" stroke="'+c+'" stroke-width="9" stroke-linecap="round"/>'
  +'<path d="M22 48L25 15L47 35ZM78 48L76 14L54 34Z" fill="'+c+'"/>'
  +'<path d="M15 62C14 40 30 33 50 34C72 33 86 42 85 63C85 84 68 90 50 90C30 90 16 82 15 62Z" fill="'+a+'"/><path d="M34 75C34 69 42 65 50 65C59 65 67 69 66 75C65 82 58 85 50 85C42 85 34 82 34 75Z" fill="'+b+'"/>'
  +'<circle cx="38" cy="56" r="3.8" fill="#5a0036"/><circle cx="62" cy="57" r="3.8" fill="#5a0036"/>'},
 function(a,b,c){return '<path d="M50 18L51 8" fill="none" stroke="'+c+'" stroke-width="4.5" stroke-linecap="round"/><path d="M45 7C45 2 56 2 56 7C56 12 45 12 45 7Z" fill="'+c+'"/>'
  +'<path d="M28 91C28 86 36 84 39 85C42 86 44 90 42 94C38 96 30 96 28 91ZM58 94C56 90 58 86 62 85C66 84 73 87 72 91C71 96 62 97 58 94Z" fill="'+c+'"/>'
  +'<path d="M30 88Q20 64 26 40Q32 16 50 16Q68 16 74 40Q80 64 70 88Q50 94 30 88Z" fill="'+a+'"/><path d="M36 73C36 64 43 60 50 60C58 60 64 65 64 73C64 80 58 85 50 85C42 85 36 80 36 73Z" fill="'+b+'"/>'
  +'<circle cx="41" cy="40" r="3.8" fill="#5a0036"/><circle cx="59" cy="41" r="3.8" fill="#5a0036"/>'},
 function(a,b,c){return '<path d="M24 41L30 14L44 36ZM42 34L50 6L58 34ZM56 36L70 14L76 41Z" fill="'+c+'"/>'
  +'<path d="M8 62C8 40 28 30 50 30C74 30 93 42 92 63C91 84 72 94 50 94C26 94 8 84 8 62Z" fill="'+a+'"/><path d="M30 77C30 70 40 66 50 66C60 66 70 70 70 77C70 84 60 87 50 87C40 87 30 84 30 77Z" fill="'+b+'"/>'
  +'<path d="M21 92C21 88 28 87 32 88C38 89 40 93 36 96C30 97 22 96 21 92ZM62 96C58 93 60 89 66 88C71 87 79 89 79 92C78 96 69 97 62 96Z" fill="'+c+'"/>'
  +'<circle cx="37" cy="58" r="3.8" fill="#5a0036"/><circle cx="63" cy="59" r="3.8" fill="#5a0036"/>'},
 function(a,b,c){return '<path d="M34 34Q24 6 36 6Q46 10 44 34ZM66 34Q76 6 64 6Q54 10 56 34Z" fill="'+c+'"/>'
  +'<path d="M24 92C24 87 32 86 36 87C42 88 44 92 41 95C36 97 25 97 24 92ZM59 95C56 92 58 88 64 87C69 86 77 88 76 92C75 97 64 97 59 95Z" fill="'+c+'"/>'
  +'<path d="M22 72C22 58 34 50 50 50C66 50 78 58 78 72C78 85 66 94 50 94C34 94 22 85 22 72Z" fill="'+a+'"/><circle cx="50" cy="48" r="26" fill="'+a+'"/><path d="M36 78C36 72 42 68 50 68C58 68 64 72 64 78C64 84 58 88 50 88C42 88 36 84 36 78Z" fill="'+b+'"/>'
  +'<circle cx="41" cy="44" r="3.8" fill="#5a0036"/><circle cx="59" cy="45" r="3.8" fill="#5a0036"/><circle cx="50" cy="53" r="3.6" fill="'+c+'"/>'}
];
function petInner(type,a,b,c){if(b===a)b=CREAM;return '<g filter="url(#rough)">'+PET_BODY[type](a,b,c)+'</g>'}
// wordmark: same recipe as Sprout. Per-letter fill, darker inner stroke; the thin dark outline and drop are a filter on .out
function wmHTML(){

// ---------- the rules ----------
const MAXM=6;
const NAMES=['mushroom','crystal','feather','flame','drop','leaf'];
const COL=['#ff4f5e','#9b6bff','#ff8fcf','#ff8a1f','#4cb6ff','#b6f03a'];
const ST=[{k:'x',n:'Not in it',e:'⬜'},{k:'y',n:'Wrong slot',e:'🟨'},{k:'g',n:'Right slot',e:'🟩'}];
const LABF={x:'grey',y:'yellow',g:'green'};
const MKK={x:'none',y:'swap',g:'tick'};
// After you press MIX, each wobbly ingredient swaps with the slot to its right (slot 3 swaps with slot 1).
// Slots are handled left to right, and a slot that already moved is not moved again.
// Returns the final row and src[j] = the slot that the ingredient now in slot j was placed in.
function mixFinal(p,u){
  const a=p.slice(),src=[0,1,2],mv=[0,0,0];
  for(let i=0;i<3;i++){
    if(u.includes(p[i])&&!mv[i]){
      const j=(i+1)%3;if(mv[j])continue;
      let t=a[i];a[i]=a[j];a[j]=t;t=src[i];src[i]=src[j];src[j]=t;mv[i]=mv[j]=1;
    }
  }
  return {fin:a,src};
}
// feedback code: per slot 0 grey, 1 yellow, 2 green; code = s0 + 3*s1 + 9*s2. 26 = all green.
const cnt6=new Int8Array(6);
function fbc(a,b,c,x,y,z){
  cnt6.fill(0);
  const ga=a===x,gb=b===y,gc=c===z;
  if(!ga)cnt6[x]++;if(!gb)cnt6[y]++;if(!gc)cnt6[z]++;
  let r0=ga?2:0,r1=gb?2:0,r2=gc?2:0;
  if(!ga&&cnt6[a]>0){r0=1;cnt6[a]--}
  if(!gb&&cnt6[b]>0){r1=1;cnt6[b]--}
  if(!gc&&cnt6[c]>0){r2=1;cnt6[c]--}
  return r0+3*r1+9*r2;
}
function score(f,r){const c=fbc(f[0],f[1],f[2],r[0],r[1],r[2]);return [c%3,Math.floor(c/3)%3,Math.floor(c/9)]}
const RECS=Array.from({length:216},(_,i)=>[Math.floor(i/36),Math.floor(i/6)%6,i%6]);
const recId=r=>r[0]*36+r[1]*6+r[2];

// every placed row (216) mapped to its final row, per unstable pair
const WORLDS={};
function world(u){
  const key=u.slice().sort().join('');
  if(WORLDS[key])return WORLDS[key];
  const pl=[],set=new Set();
  for(let p=0;p<216;p++){const fin=mixFinal(RECS[p],u).fin,fid=recId(fin);pl.push({p,fin,fid});set.add(fid)}
  return WORLDS[key]={key,pl,set,list:[...set].sort((m,n)=>m-n)};
}
// Consistent-guess solver. Tracks every recipe still possible. Each turn it picks a placement whose FINAL row
// (after the wobble swap) is itself a possible recipe, and that splits the possible recipes best (smallest worst case).
const MEMO=new Map(),c27=new Int32Array(27);
function solve(rec,u){
  const W=world(u);let cands=W.list.slice();const gs=[];
  for(let k=1;k<=MAXM;k++){
    if(!cands.length)break;
    const mk=W.key+'|'+cands.join(',');
    let bp=MEMO.get(mk);
    if(bp===undefined){
      const cs=new Set(cands);let bm=1e9,bs=1e9;bp=-1;
      for(const e of W.pl){
        if(!cs.has(e.fid))continue;
        c27.fill(0);const f=e.fin;
        for(const c of cands){const r=RECS[c];c27[fbc(f[0],f[1],f[2],r[0],r[1],r[2])]++}
        let m=0,s=0;for(let q=0;q<27;q++){const v=c27[q];if(v>m)m=v;s+=v*v}
        if(m<bm||(m===bm&&s<bs)){bm=m;bs=s;bp=e.p}
      }
      MEMO.set(mk,bp);
    }
    const e=W.pl[bp];gs.push(RECS[bp]);
    const code=fbc(e.fin[0],e.fin[1],e.fin[2],rec[0],rec[1],rec[2]);
    if(code===26)return {par:k,guesses:gs};
    cands=cands.filter(c=>{const r=RECS[c];return fbc(e.fin[0],e.fin[1],e.fin[2],r[0],r[1],r[2])===code});
  }
  return {par:0,guesses:gs};
}
// Seeded day. Two ingredients are wobbly. About 4 days in 10 the recipe repeats an ingredient.
// The recipe must be reachable, must include a wobbly ingredient (so the twist matters), and the solver must crack it in 5 or fewer.
// First choice is a day with par 3 to 5 so it is never a freebie.
function genDay(seed){
  let last=null;
  for(let a=0;a<800;a++){
    const r=mulberry32(hashStr(seed+'#'+a)),ri=n=>Math.floor(r()*n);
    const u0=ri(6);let u1=ri(5);if(u1>=u0)u1++;
    const u=[Math.min(u0,u1),Math.max(u0,u1)];
    const rep=r()<.4;let rec;
    if(rep){const x=ri(6);let y=ri(5);if(y>=x)y++;const q=ri(3);rec=[x,x,x];rec[q]=y}
    else{const pool=[0,1,2,3,4,5];rec=[];for(let i=0;i<3;i++)rec.push(pool.splice(ri(pool.length),1)[0])}
    if(!world(u).set.has(recId(rec)))continue;
    if(!rec.some(x=>u.includes(x)))continue;
    const sol=solve(rec,u);
    last={rec,u,par:sol.par,solver:sol.guesses,rep,tries:a+1};
    if(sol.par>0&&sol.par<=MAXM-1&&(sol.par>=3||a>=60))return last;
  }
  return last;
}
function slowScore(f,r){ // independent check of the feedback rule
  const out=[];
  for(let i=0;i<3;i++){
    if(f[i]===r[i]){out.push(2);continue}
    let inRec=0,usedBefore=0;
    for(let j=0;j<3;j++)if(r[j]===f[i]&&f[j]!==r[j])inRec++;
    for(let j=0;j<i;j++)if(f[j]===f[i]&&f[j]!==r[j])usedBefore++;
    out.push(usedBefore<inRec?1:0);
  }
  return out;
}
function check(){
  let bad=0,reps=0;const hist={};
  const rr=mulberry32(7);
  for(let n=0;n<300;n++){const f=[0,0,0].map(()=>Math.floor(rr()*6)),r=[0,0,0].map(()=>Math.floor(rr()*6));if(score(f,r).join()!==slowScore(f,r).join())bad++}
  for(let d=1;d<=60;d++){
    const s='2026-12-'+String(d).padStart(2,'0'),day=genDay(s);
    if(!day){bad++;continue}
    if(JSON.stringify(genDay(s).rec)!==JSON.stringify(day.rec))bad++;
    if(day.rec.length!==3||day.rec.some(x=>!(x>=0&&x<6)))bad++;
    if(day.u.length!==2||day.u[0]===day.u[1]||day.u.some(x=>!(x>=0&&x<6)))bad++;
    if(!world(day.u).set.has(recId(day.rec)))bad++;
    if(day.rep){reps++;if(new Set(day.rec).size!==2)bad++}else if(new Set(day.rec).size!==3)bad++;
    const sol=solve(day.rec,day.u);
    if(sol.par<1||sol.par>MAXM-1||sol.par!==day.par)bad++;
    // replay the solver through the same swap rule the game uses
    let won=0;
    sol.guesses.forEach((p,k)=>{if(won)return;const f=mixFinal(p,day.u).fin;if(score(f,day.rec).join()==='2,2,2')won=k+1});
    if(won!==sol.par)bad++;
    hist[sol.par]=(hist[sol.par]||0)+1;
  }
  console.log('Pet Lab self-check, 60 days, par spread',JSON.stringify(hist),'repeat days',reps,'problems:',bad);
}
check();

let seed,practice,day,tries=[],pot=[null,null,null],sel=0,locked=false;
const finOf=k=>mixFinal(tries[k],day.u);
const fbOf=k=>score(finOf(k).fin,day.rec);
const hasWon=()=>tries.some((t,k)=>fbOf(k).join()==='2,2,2');
const isOver=()=>hasWon()||tries.length>=MAXM;
function begin(s,p){
  seed=s;practice=p;locked=false;day=genDay(s);pot=[null,null,null];sel=0;
  $('hatch').style.display='none';

function sayHTML(){

  if(g===3)return 'Hatched!<small>Solved in '+n+' of 6 mixes.</small>';
  if(n>=MAXM)return 'The pot fizzled out.<small>No mixes left.</small>';
  const sw=[];
  m.fin.forEach((ing,j)=>{if(day.u.includes(ing)&&m.src[j]!==j&&tries[n-1][j]!==ing)sw.push('The wobbly '+NAMES[ing]+' moved from slot '+(m.src[j]+1)+' to slot '+(j+1)+'.')});

const tally=s=>{const g=s.filter(x=>x===2).length,y=s.filter(x=>x===1).length;return g+y===0?'Nothing in it':[g?g+' right':'',y?y+' misplaced':''].filter(Boolean).join(', ')};
function rowHTML(k,flip){

function renderPot(){

function updateMix(){$('mix').disabled=locked||isOver()||pot.includes(null)}

function put(i){

  if(locked||isOver()||pot.includes(null))return;
