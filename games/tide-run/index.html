<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tide Run</title>
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<style>
@font-face{font-family:"Allo";src:url("../../shared/AlloVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#2f8bff;--tint:#4a9bff;--ink:#0b2a66;--cream:#fff8e6;--card:#fffaf0;--sand:#ffd98a;--coral:#ff5a5f;--sun:#ffc93c;--water:#9fcbff;--u:min(100vw,480px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ink);font-family:"Allo",system-ui,sans-serif;font-variation-settings:"ROND" 100,"opsz" 18;overflow:hidden;touch-action:manipulation;user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg)}
section{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden}
section.on{display:flex}
img{-webkit-user-drag:none}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* ground: flat colour, with the stripes and dots on their own layer, shown only in soft random patches */
.pop{background:var(--bg);isolation:isolate}
.pop::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(circle,rgba(255,255,255,.22) 1.5px,transparent 2px) 0 0/16px 16px,repeating-linear-gradient(-32deg,transparent 0 64px,var(--tint) 64px 128px);
 -webkit-mask-image:radial-gradient(circle at var(--a1x,12%) var(--a1y,10%),#000 0,transparent var(--a1r,22%)),radial-gradient(circle at var(--a2x,88%) var(--a2y,22%),#000 0,transparent var(--a2r,20%)),radial-gradient(circle at var(--a3x,6%) var(--a3y,62%),#000 0,transparent var(--a3r,20%)),radial-gradient(circle at var(--a4x,92%) var(--a4y,70%),#000 0,transparent var(--a4r,24%)),radial-gradient(circle at var(--a5x,50%) var(--a5y,98%),#000 0,transparent var(--a5r,20%));
 mask-image:radial-gradient(circle at var(--a1x,12%) var(--a1y,10%),#000 0,transparent var(--a1r,22%)),radial-gradient(circle at var(--a2x,88%) var(--a2y,22%),#000 0,transparent var(--a2r,20%)),radial-gradient(circle at var(--a3x,6%) var(--a3y,62%),#000 0,transparent var(--a3r,20%)),radial-gradient(circle at var(--a4x,92%) var(--a4y,70%),#000 0,transparent var(--a4r,24%)),radial-gradient(circle at var(--a5x,50%) var(--a5y,98%),#000 0,transparent var(--a5r,20%))}
.pop>*{position:relative}
/* wordmark: same recipe as Sprout. One line, per letter fill, darker inner stroke, thin em-based outer outline */
.out{filter:drop-shadow(.045em 0 0 var(--ink)) drop-shadow(-.045em 0 0 var(--ink)) drop-shadow(0 .045em 0 var(--ink)) drop-shadow(0 -.045em 0 var(--ink)) drop-shadow(0 .09em 0 var(--ink))}
.wm{display:flex;align-items:flex-end;justify-content:center;font-size:min(14vw,64px);line-height:1;padding-top:.3em}
.wm .L{display:block;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;line-height:.8;color:var(--c);-webkit-text-stroke:.13em var(--s);paint-order:stroke fill;margin:0 -.005em;transform:translateY(var(--y,0)) rotate(var(--r,0deg))}
.wm .gap{display:block;width:.28em}
.wm .o{display:block;position:relative;width:.95em;height:.72em;margin:0 0 0 .06em;transform:translateY(var(--y,0)) rotate(var(--r,0deg))}
.wm .o img{position:absolute;left:0;bottom:-.03em;width:.95em;height:.95em;display:block;pointer-events:none}
.wm.small{font-size:48px;padding-top:0}
.tg{display:block;font-size:20px;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;letter-spacing:.14em;line-height:1;color:#fff;transform:rotate(-5deg);margin:0}
.btn{border:0;background:#111;color:#fff;border-radius:10px;font-weight:800;font-size:20px;min-height:56px;padding:0 48px;cursor:pointer;font-variation-settings:"ROND" 60,"opsz" 20}
.btn:active{transform:translateY(2px)}
.link{background:none;border:0;color:var(--ink);font-weight:800;font-size:16px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px;cursor:pointer;padding:12px 8px;min-height:48px;font-variation-settings:"ROND" 60,"opsz" 16}
/* landing */
#start{align-items:center;justify-content:center;text-align:center;padding:32px 24px;gap:0}
#start .wmw{margin-bottom:26px}
#start .tg{margin:8px 0 0 38%}
.lead{margin:0 0 26px;font-size:20px;font-weight:800;line-height:1.3;max-width:300px;font-variation-settings:"ROND" 60,"opsz" 20}
.fine{margin-top:18px;font-size:15px;font-weight:700;opacity:.85;min-height:1.3em}
/* play screen: flat colour, cream card */
#game{padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:var(--bg)}
.card{position:relative;padding:16px;display:grid;gap:14px;margin:auto 0}
.card::before,.sheet::before{content:"";position:absolute;inset:0;z-index:0;background:var(--card);border-radius:20px;filter:url(#roughL)}
.card>*,.sheet>*{position:relative;z-index:1}
.card header{display:flex;justify-content:space-between;align-items:center}
.card header b{font-size:22px;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32}
#streak{font-size:15px;font-weight:800}
#slots{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.slot{position:relative;aspect-ratio:1;display:grid;place-items:center}
.slot::before,.st::before{content:"";position:absolute;inset:0;border-radius:8px;background:var(--tc,#f3e9cd);filter:url(#roughS)}
.slot.now::before{background:#ecdcae}
.slot.fill::before{display:none}
.slot.fill{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:none}}
.st{--tc:var(--bg);position:relative;aspect-ratio:1;width:100%;display:grid;place-items:center}
.st.y{--tc:var(--sun)}.st.g{--tc:var(--coral)}.st.r{--tc:var(--ink)}
.st img{position:relative;width:78%;height:78%;display:block}
.board{width:min(100%,50vh);aspect-ratio:1;margin:0 auto}
#grid{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:6px;width:100%;height:100%}
.cell{position:relative;border:0;padding:0;margin:0;min-width:0;min-height:48px;background:none;font:inherit;color:var(--ink);cursor:pointer}
.cell::after{content:"";position:absolute;inset:0;z-index:0;border-radius:12px;background:var(--sand);filter:url(#rough)}
.cell:active{transform:scale(.95)}
.cell .sp{z-index:1;position:absolute;left:17%;top:17%;width:66%;height:66%;pointer-events:none}
.cell .runner{left:14%;top:14%;width:72%;height:72%;animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-7%)}}
.cell.wet{cursor:default}
.cell.wet::after{background:var(--water) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='16' viewBox='0 0 32 16'><path d='M3 9.5 Q8 2.5 16 8.5 T29 8' fill='none' stroke='%23fff8e6' stroke-width='3' stroke-linecap='round'/></svg>") center/32px 16px no-repeat}
.cell.wet .sp:not(.fx){opacity:.35}
.cell.rock{cursor:default}
.ring{position:absolute;inset:2px;z-index:3;pointer-events:none;border:4px solid var(--coral);border-radius:15px 10px 14px 9px/10px 15px 9px 14px;filter:url(#roughR)}
.cell .n{z-index:2;position:absolute;right:8%;top:5%;font-size:15px;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 18;font-variant-numeric:tabular-nums;line-height:1;z-index:2}
.cell.next .n{font-size:20px}
.cell:has(.ring) .n{z-index:5;background:var(--sand);padding:3px 5px 2px;border-radius:8px;right:6%;top:4%}
.cell .cr{left:3%;top:4%;width:42%;height:42%;z-index:2}
.cell.next .sp:not(.cr){left:22%;top:28%;width:60%;height:60%}
.cell.next .runner{left:20%;top:26%;width:64%;height:64%}
.cell.rise::before{content:"";position:absolute;inset:0;z-index:4;border-radius:12px;background:var(--water);filter:url(#rough);animation:rise .6s ease-out}
@keyframes rise{0%{clip-path:inset(100% -8px -8px -8px)}100%{clip-path:inset(-8px)}}
.cell.gone .sp{animation:wash .6s ease-out}
@keyframes wash{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.say-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
#say{min-width:0;display:flex;flex-direction:column;gap:4px}
#say b{font-size:20px;font-weight:900;line-height:24px;font-variation-settings:"ROND" 100,"opsz" 28}
#say small{font-size:15px;font-weight:600;line-height:1.3;opacity:.85}
#pts{display:flex;align-items:baseline;gap:5px;white-space:nowrap;line-height:24px;text-align:right}
#pts b{font-size:20px;font-weight:900;line-height:24px;font-variation-settings:"ROND" 100,"opsz" 28;font-variant-numeric:tabular-nums}
#pts span{font-size:14px;font-weight:700;line-height:24px}
#legend{display:flex;justify-content:space-between;gap:8px;flex-wrap:nowrap}
#legend .k{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;white-space:nowrap}
#legend img{width:20px;height:20px;display:block;flex:none}
#restart{justify-self:start;margin:-8px 0 -6px;font-size:15px;padding:12px 0}
/* result: loud ground again */
#end{align-items:center;padding:30px 16px 16px;gap:0;overflow-y:auto}
#end .small{margin:10px 0 6px}
.sheet{position:relative;width:100%;max-width:400px;padding:18px;display:grid;gap:14px;margin-top:18px}
.sheet .top{display:grid;grid-template-columns:1fr;justify-items:center;text-align:center;gap:6px}
#cdate{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
#ctitle{font-size:30px;font-weight:900;line-height:1;margin-top:4px;font-variation-settings:"ROND" 100,"opsz" 32}
.sheet .num{text-align:center;line-height:.85;display:flex;align-items:baseline;justify-content:center;gap:6px}
.sheet .num b{display:block;font-size:60px;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;font-variant-numeric:tabular-nums}
.sheet .num span{font-size:14px;font-weight:700}
#plate{aspect-ratio:1}
#plate svg{display:block;width:100%;height:100%}
#rtiles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
#rtiles .st{width:48px}
#par{font-size:15px;font-weight:700;line-height:1.35;text-align:center;opacity:.75}
.endbtns{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;margin-top:14px}
#cfine{font-size:15px;font-weight:700;text-align:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="rough" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="roughS" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="roughL" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
<filter id="roughR" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="12" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<div id="app">
  <section id="start" class="pop on">
    <div class="wmw"><div class="wm out big" id="wm1" role="img" aria-label="Tide Run"></div></div>
    <p class="lead">Nine moves. The sea floods the island from the edge in. Grab chests, reach the flag.</p>
    <button class="btn" id="play">Play</button>
    <div class="fine" id="sfine"></div>
  </section>

  <section id="game">
    <div class="card">
      <header><b>Tide Run</b><div id="streak"></div></header>
      <div id="slots" aria-label="Your moves"></div>
      <div class="board"><div id="grid" aria-label="Island"></div></div>
      <div class="say-row"><div id="say"></div><div id="pts"></div></div>
      <button class="link" id="restart" style="display:none">Take that first move back</button>
      <div id="legend" aria-label="Key"></div>
    </div>
  </section>

  <section id="end" class="pop">
    <div class="wm out small" id="wm2" role="img" aria-label="Tide Run"></div>
    <div class="sheet">
      <div class="top">
        <div><div id="cdate"></div><div id="ctitle"></div></div>
        <div class="num"><b id="cscore"></b><span>of 9 points</span></div>
      </div>
      <div id="plate" aria-label="Your route across the island"></div>
      <div id="rtiles" aria-label="Result"></div>
      <div id="par"></div>
    </div>
    <div class="endbtns"><button class="btn" id="copy">Copy result</button><div id="cfine"></div><button class="link" id="prac">Try a practice island</button></div>
  </section>
</div>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const $=id=>document.getElementById(id);
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ds(new Date())}
function load(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('on',s===id))}
let ac;function tone(f,d,type,vol,slide){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,ac.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);g.gain.setValueAtTime(vol||.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ---------- the board ----------
// 5x5, index = row*5+col. Every tile has a flood time t: it is under water after t moves.
// The sea takes the outer ring first, then the next ring, then the middle. All gone after move 9.
const W=5,N=25,MAXM=9;
const RING0=[0,1,2,3,4,9,14,19,24,23,22,21,20,15,10,5],RING1=[6,7,8,13,18,17,16,11];
const ringOf=i=>{const r=Math.floor(i/W),c=i%W;return Math.min(r,c,W-1-r,W-1-c)};
function nbrs(i){const r=Math.floor(i/W),c=i%W,o=[];if(r>0)o.push(i-W);if(r<W-1)o.push(i+W);if(c>0)o.push(i-1);if(c<W-1)o.push(i+1);return o}
function floodTimes(r){
  const o0=Math.floor(r()*16),o1=Math.floor(r()*8),rev=r()<.5,t=new Array(N).fill(MAXM);
  const ord=(a,o)=>{const b=a.map((_,i)=>a[(i+o)%a.length]);return rev?b.reverse():b};
  const put=(list,sizes,t0)=>{let p=0;sizes.forEach((s,k)=>{for(let j=0;j<s;j++)t[list[p++]]=t0+k})};
  put(ord(RING0,o0),[3,3,3,3,4],1);put(ord(RING1,o1),[3,3,2],6);t[12]=9;
  return t;
}
function shuffled(a,r){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const pop=m=>(m&1)+((m>>1)&1)+((m>>2)&1);
const legal=(D,pos,m)=>nbrs(pos).filter(n=>!D.rocks.includes(n)&&D.t[n]>m);

// Plays a list of moves. Tiles: b plain move, y chest, g flag, r washed away.
function simulate(D,moves){
  let pos=D.start,m=0,mask=0,over=false,won=false,washed=false,stranded=false;const tiles=[];
  for(const c of moves){
    if(over)break;
    m++;pos=c;
    if(c===D.flag){tiles.push('g');won=true;over=true;break}
    const ci=D.chests.indexOf(c);let got=false;
    if(ci>=0&&!(mask&(1<<ci))){mask|=1<<ci;got=true}
    if(D.t[c]<=m){tiles.push('r');over=true;washed=true}else tiles.push(got?'y':'b');
  }
  if(!over&&legal(D,pos,m).length===0){tiles.push('r');over=true;washed=true;stranded=true}
  return {tiles,pos,m,mask,over,won,washed,stranded,score:2*pop(mask)+(won?3:0)};
}

// Solver: layer by layer search over (position, chests held). Finds the best score, the fewest moves for it,
// one best route, and how many different best routes exist.
function solve(D){
  let cur=new Map([[D.start<<3,{w:1,p:null}]]);const layers=[cur];
  let best=null;
  for(let m=0;m<MAXM;m++){
    const next=new Map();
    for(const [k,s] of cur){
      const pos=k>>3,mask=k&7;
      for(const n of nbrs(pos)){
        if(D.rocks.includes(n)||D.t[n]<=m)continue;
        const m2=m+1;
        if(n===D.flag){
          const sc=2*pop(mask)+3;
          if(!best||sc>best.score||(sc===best.score&&m2<best.moves)){best={score:sc,moves:m2,layer:m,key:k,end:n,ways:s.w}}
          else if(sc===best.score&&m2===best.moves)best.ways+=s.w;
          continue;
        }
        let nm=mask;const ci=D.chests.indexOf(n);if(ci>=0)nm|=1<<ci;
        if(D.t[n]<=m2)continue;
        const key=(n<<3)|nm,e=next.get(key);
        if(e)e.w+=s.w;else next.set(key,{w:s.w,p:k});
      }
    }
    cur=next;layers.push(cur);
  }
  if(!best)return null;
  const path=[best.end];let k=best.key;
  for(let l=best.layer;l>=0;l--){path.push(k>>3);k=layers[l].get(k).p;if(k===null)break}
  path.reverse();path.shift(); // moves only, not the start tile
  return {score:best.score,moves:best.moves,path,ways:best.ways};
}
function dists(D,src){const d=new Array(N).fill(99);d[src]=0;const q=[src];while(q.length){const x=q.shift();for(const n of nbrs(x))if(!D.rocks.includes(n)&&d[n]===99){d[n]=d[x]+1;q.push(n)}}return d}
// Greedy player: always walks toward the nearest chest, then the flag.
function greedy(D){
  let pos=D.start,m=0,mask=0;const moves=[];
  while(m<MAXM){
    const left=D.chests.filter((c,i)=>!(mask&(1<<i)));
    let target=D.flag;
    if(left.length){const d=dists(D,pos);target=left.slice().sort((a,b)=>d[a]-d[b]||a-b)[0]}
    const dt=dists(D,target),opts=legal(D,pos,m);
    if(!opts.length)break;
    opts.sort((a,b)=>dt[a]-dt[b]||a-b);
    const n=opts[0];moves.push(n);m++;pos=n;
    const ci=D.chests.indexOf(n);if(ci>=0)mask|=1<<ci;
    if(n===D.flag||D.t[n]<=m)break;
  }
  return simulate(D,moves);
}
// Build a day. Strict: best route takes 2+ chests and the flag, only a few best routes exist, and greedy chest grabbing scores less.
function genDay(seed){
  let last=null;
  for(let a=0;a<1500;a++){
    const r=mulberry32(hashStr(seed+'#'+a));
    const t=floodTimes(r),order=shuffled(Array.from({length:N},(_,i)=>i),r);
    const nr=3+Math.floor(r()*2),rocks=order.slice(0,nr).sort((x,y)=>x-y),rest=order.slice(nr);
    const start=rest[0],mid=rest.filter(i=>i!==start&&ringOf(i)>=1),flag=mid[0];
    const chests=rest.filter(i=>i!==start&&i!==flag).slice(0,3);
    const D={t,rocks,start,flag,chests};
    const sol=solve(D);if(!sol||sol.score<7)continue;
    const gr=greedy(D),strict=sol.ways<=4&&gr.score<sol.score;
    const level=strict?0:gr.score<sol.score?1:2;
    last={D,par:sol.score,parMoves:sol.moves,path:sol.path,ways:sol.ways,greedy:gr.score,level,tries:a+1};
    if(level===0||(a>=600&&level<=1)||a>=1200)return last;
  }
  return last;
}
function check(){
  let bad=0;const hist={},lv={};
  for(let d=1;d<=60;d++){
    const s='2026-12-'+String(d).padStart(2,'0'),day=genDay(s);
    if(!day){bad++;continue}
    const D=day.D;
    if(JSON.stringify(genDay(s).D)!==JSON.stringify(D))bad++;
    const ids=[D.start,D.flag,...D.chests,...D.rocks];
    if(new Set(ids).size!==ids.length||ids.some(i=>!(i>=0&&i<N)))bad++;
    if(D.rocks.length<3||D.rocks.length>4||D.chests.length!==3)bad++;
    if(ringOf(D.flag)<1)bad++;
    const sim=simulate(D,day.path);
    if(!sim.won||sim.score!==day.par||sim.tiles.length!==day.parMoves||sim.tiles.includes('r'))bad++;
    if(day.par<7||day.parMoves>MAXM)bad++;
    if(day.level!==0)bad++;
    hist[day.par]=(hist[day.par]||0)+1;lv[day.level]=(lv[day.level]||0)+1;
  }
  console.log('Tide Run self-check, 60 days, par spread',JSON.stringify(hist),'strict levels',JSON.stringify(lv),'problems:',bad);
  return bad;
}

// ---------- game ----------
let seed,practice,day,moves=[],locked=false,sim;
function begin(s,p){
  seed=s;practice=p;locked=false;day=genDay(s);
  const done=!p&&load('tr_'+s,null);
  if(done){moves=done.m;sim=simulate(day.D,moves);return showCard()}
  moves=p?[]:load('tr_p_'+s,[]);
  sim=simulate(day.D,moves);
  show('game');render(false);
}
function sayHTML(){
  const D=day.D,n=sim.tiles.length;
  if(!n)return '<b class="carve">Tap a tile next to you.</b><small>The sea rises after every move. The number on a tile is how many moves until it floods.</small>';
  const last=sim.tiles[n-1];
  if(last==='g')return '<b class="carve">Flag reached.</b><small>Dry feet, mostly.</small>';
  if(last==='r')return sim.stranded?'<b class="carve">Nowhere left to go.</b><small>The sea took the last dry tile.</small>':'<b class="carve">Washed away.</b><small>You stood on a tile as it flooded.</small>';
  const soon=D.t.filter(x=>x===sim.m+1).length;
  return '<b class="carve">'+(last==='y'?'Chest. +2':'Keep moving.')+'</b><small>Next to flood: '+soon+' tile'+(soon===1?'':'s')+'. <span style="white-space:nowrap">Move '+(sim.m+1)+' of 9.</span></small>';
}
function render(anim){
  const D=day.D,m=sim.m;
  $('streak').textContent=load('tr_streak',0)?'Streak '+load('tr_streak',0):'';
  $('slots').innerHTML=Array.from({length:MAXM},(_,i)=>{
    if(i<sim.tiles.length){const k=sim.tiles[i];return `<div class="slot fill" ${anim&&i===sim.tiles.length-1?'':'style="animation:none"'}>${stamp(k)}</div>`}
    return `<div class="slot ${i===sim.tiles.length&&!sim.over?'now':''}"></div>`}).join('');
  $('pts').innerHTML='<b>'+sim.score+'</b><span class="cap">of 9 points</span>';
  const ok=legal(D,sim.pos,m);
  let h='';
  for(let i=0;i<N;i++){
    const wet=D.t[i]<=m,rock=D.rocks.includes(i),left=D.t[i]-m,next=!wet&&left===1;
    const ci=D.chests.indexOf(i),coin=ci>=0&&!(sim.mask&(1<<ci)),isFlag=i===D.flag,here=i===sim.pos;
    const can=!sim.over&&!locked&&ok.includes(i);
    let inner='';
    if(rock)inner+=IC.rock;
    else if(isFlag)inner+=IC.flag;
    else if(coin&&!here)inner+=IC.chest;
    if(here)inner+=(sim.washed?IC.splash:IC.me);
    if(next&&!rock)inner+=IC.crest;
    if(can)inner+='<i class="ring"></i>';
    if(!wet&&!rock)inner+=`<span class="n">${left}</span>`;
    const cls=['cell',wet?'wet':'',rock?'rock':'',next&&!rock?'next':'',here?'me':'',here&&sim.washed?'gone':'',anim&&wet&&D.t[i]===m?'rise':''].filter(Boolean).join(' ');
    const r=Math.floor(i/W)+1,c=i%W+1;
    const lab='Row '+r+', column '+c+', '+(rock?'rock':wet?'water':isFlag?'flag':coin?'chest':'sand')+(!wet&&!rock?', floods in '+left+' moves':'')+(here?', you are here':'')+(can?', you can move here':'');
    h+=`<button class="${cls}" data-i="${i}" aria-label="${lab}">${inner}</button>`;
  }
  $('grid').innerHTML=h;
  $('say').innerHTML=sayHTML();
  $('restart').style.display=(sim.tiles.length===1&&!sim.over)?'':'none';
}
function tap(i){
  if(locked||sim.over)return;
  const D=day.D;
  if(!legal(D,sim.pos,sim.m).includes(i)){tone(140,.12,'square',.04);try{const g=$('grid');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}catch(e){}return}
  moves.push(i);sim=simulate(D,moves);
  const k=sim.tiles[sim.tiles.length-1];
  render(true);
  tone(k==='y'?740:k==='g'?523:360,.14,'triangle',.08);
  setTimeout(()=>tone(220,.45,'sine',.05,90),130);
  if(k==='y')setTimeout(()=>tone(988,.14,'triangle',.08),150);
  if(k==='g'){[523,659,784,1047].forEach((q,j)=>setTimeout(()=>tone(q,.18,'triangle',.1),j*90));buzz([40,40,80])}
  else if(k==='r'){tone(300,.5,'sawtooth',.06,70);buzz([90,50,120])}
  else buzz(k==='y'?[30,30,30]:[18]);
  if(!practice)save('tr_p_'+seed,moves);
  if(sim.over){locked=true;setTimeout(finishAll,1300)}
}
function finishAll(){
  if(!practice){
    save('tr_'+seed,{m:moves});
    const days=load('tr_days',[]);
    if(!days.includes(seed)){days.push(seed);save('tr_days',days);
      if(sim.won){const last=load('tr_last',''),y=ds(new Date(Date.now()-864e5));save('tr_streak',last===y?load('tr_streak',0)+1:1);save('tr_last',seed)}
      else save('tr_streak',0)}
  }
  showCard();
}
// the result map: island, flood numbers, the route as a dotted path
function plateSVG(){
  const D=day.D,C=44,G=5,P=10,S=P*2+C*5+G*4,ctr=i=>[P+(i%W)*(C+G)+C/2,P+Math.floor(i/W)*(C+G)+C/2];
  let s=`<svg viewBox="0 0 ${S} ${S}" aria-hidden="true"><defs><filter id="pr" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="6" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter></defs><rect width="${S}" height="${S}" rx="16" fill="#9fcbff" filter="url(#pr)"/><g filter="url(#pr)">`;
  for(let i=0;i<N;i++){
    const x=P+(i%W)*(C+G),y=P+Math.floor(i/W)*(C+G),gone=D.t[i]<=sim.m,rock=D.rocks.includes(i);
    s+=`<rect x="${x}" y="${y}" width="${C}" height="${C}" rx="9" fill="${gone?"#b9d9ff":"#ffd98a"}"/>`;
    if(rock)s+=`<image href="assets/rock.svg" x="${x+6}" y="${y+6}" width="${C-12}" height="${C-12}" opacity="${gone?.4:1}"/>`;
    else if(i===D.flag)s+=`<image href="assets/flag-hill.svg" x="${x+4}" y="${y+4}" width="${C-8}" height="${C-8}" opacity="${gone?.4:1}"/>`;
    else if(D.chests.includes(i))s+=`<image href="assets/chest.svg" x="${x+6}" y="${y+6}" width="${C-12}" height="${C-12}" opacity="${gone?.4:1}"/>`;
    if(!rock)s+=`<text x="${x+C-4}" y="${y+13}" text-anchor="end" font-family="Allo,sans-serif" font-weight="900" font-size="12" fill="#0b2a66">${D.t[i]}</text>`;
  }
  const pts=[D.start,...moves.slice(0,sim.tiles.length)].map(ctr);
  const poly=pts.map(p=>p.join(',')).join(' ');
  s+=`<polyline points="${poly}" fill="none" stroke="#ff5a5f" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 10"/>`;
  s+=`</g>`;const [sx,sy]=ctr(D.start);s+=`<image href="assets/runner.svg" x="${sx-17}" y="${sy-17}" width="34" height="34"/>`;
  const [ex,ey]=pts[pts.length-1];
  if(sim.washed)s+=`<image href="assets/splash.svg" x="${ex-20}" y="${ey-20}" width="40" height="40"/>`;
  return s+'</svg>';
}
function showCard(){
  const n=sim.tiles.length,sc=sim.score;
  show('end');
  $('cdate').textContent=practice?'Practice island':'Tide Run '+seed;
  $('ctitle').textContent=sim.won?(sc>=day.par?'Perfect run':sc>=7?'Strong run':sc>=5?'Safe and sound':'Made it out'):(sim.stranded?'Stranded':'Washed away');
  $('cscore').textContent=sc;
  $('plate').innerHTML=plateSVG();
  $('rtiles').innerHTML=sim.tiles.map(k=>stamp(k)).join('');
  $('par').textContent='Best route: '+day.par+' points in '+day.parMoves+' moves. Numbers show the move.';
  $('cfine').textContent=practice?'Practice does not count':'Streak '+load('tr_streak',0)+' · same island for everyone today';
  window._share='Tide Run '+seed+'\n'+sim.tiles.map(k=>EMO[k]).join('')+' '+sc+'/9';

$('play').onclick=()=>begin(today(),false);
$('grid').onclick=e=>{const b=e.target&&e.target.closest&&e.target.closest('button');if(b&&b.dataset&&b.dataset.i!==undefined)tap(+b.dataset.i)};
$('restart').onclick=()=>{if(locked||sim.tiles.length!==1||sim.over)return;moves=[];sim=simulate(day.D,moves);if(!practice)save('tr_p_'+seed,moves);tone(260,.15,'triangle',.06);render(false)};
$('copy').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(window._share):Promise.reject()).then(()=>$('copy').textContent='Copied!',()=>prompt('Copy:',window._share))};
$('prac').onclick=()=>{$('copy').textContent='Copy result';begin('practice-'+Math.random().toString(36).slice(2,7),true)};
addEventListener('error',e=>{const s=$('say');if(s)s.textContent='Error: '+e.message});
$('sfine').textContent=load('tr_'+today(),null)?'You have played today. See your result.':(load('tr_streak',0)?'Streak '+load('tr_streak',0):'New island every day');
// test hooks: ?demo=start | game | end | washed. They never write to storage.
(function(){
  const d=new URLSearchParams(location.search).get('demo');
  if(!d||d==='start')return;
  seed='2026-12-07';practice=false;locked=false;day=genDay(seed);

  else if(d==='end')moves=day.path.slice();
  else if(d==='washed'){const D=day.D;let pos=D.start;moves=[];for(let k=0;k<MAXM;k++){const nb=nbrs(pos).filter(n=>!D.rocks.includes(n)).sort((a,b)=>D.t[a]-D.t[b]);if(!nb.length)break;moves.push(nb[0]);pos=nb[0];if(D.t[pos]<=moves.length)break}}

<script>
/* Hand-cut corners v2: rough, hand-torn edges drawn as a vector clip-path outline (crisp at any pixel density, no filters). */
(function(){
  var st=document.createElement("style");st.textContent="[data-hp=b]::before{clip-path:var(--hcp);-webkit-clip-path:var(--hcp)}[data-hp=a]::after{clip-path:var(--hcp);-webkit-clip-path:var(--hcp)}";document.head.appendChild(st);
  var n=0;
  function R(seed){var x=Math.sin(seed*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
  function outline(w,h,r,seed){
    // walk the perimeter of a rounded rectangle, sampling about every 5px, pushing each point in or out a little
    r=Math.min(r,w/2-1,h/2-1);
    var pts=[],step=5,amp=Math.max(1.6,Math.min(3.6,Math.min(w,h)*.055));
    var segs=[[r,0,w-r,0],[w,r,w,h-r],[w-r,h,r,h],[0,h-r,0,r]];
    var corners=[[w-r,r,-Math.PI/2],[w-r,h-r,0],[r,h-r,Math.PI/2],[r,r,Math.PI]];
    var k=0;
    for(var s=0;s<4;s++){
      var a=segs[s],len=Math.hypot(a[2]-a[0],a[3]-a[1]),m=Math.max(2,Math.round(len/step));
      var nx=[0,1,0,-1][s],ny=[-1,0,1,0][s];
      for(var i=0;i<m;i++){var t=i/m,x=a[0]+(a[2]-a[0])*t,y=a[1]+(a[3]-a[1])*t;
        var d=(Math.sin(k*.7+seed)*.45+ (R(seed*31+k)-.5)*1.1)*amp;k++;
        pts.push([x+nx*d,y+ny*d])}
      var c=corners[s],cm=Math.max(3,Math.round(r*1.57/step));
      for(var j=0;j<cm;j++){var an=c[2]+(Math.PI/2)*(j/cm),d2=(R(seed*17+k)-.5)*1.1*amp;k++;
        pts.push([c[0]+Math.cos(an)*(r+d2),c[1]+Math.sin(an)*(r+d2)])}
    }
    // smooth through midpoints so the wobble reads as a cut edge, not a zigzag
    var p='M'+((pts[0][0]+pts[1][0])/2).toFixed(1)+' '+((pts[0][1]+pts[1][1])/2).toFixed(1);
    for(var q=1;q<=pts.length;q++){var A=pts[q%pts.length],B=pts[(q+1)%pts.length];
      p+=' Q'+A[0].toFixed(1)+' '+A[1].toFixed(1)+' '+((A[0]+B[0])/2).toFixed(1)+' '+((A[1]+B[1])/2).toFixed(1)}
    return p+'Z';
  }
  function shape(el){
    if(!el.dataset)return;var cs=getComputedStyle(el);
    var r=parseFloat(cs.borderTopLeftRadius)||0;
    var pseudo="";
    if(r<4){var pb=getComputedStyle(el,"::before"),pa=getComputedStyle(el,"::after");
      if(pb.content&&pb.content!=="none"&&pb.position==="absolute"&&(parseFloat(pb.borderTopLeftRadius)||0)>=4){r=parseFloat(pb.borderTopLeftRadius);pseudo="b"}
      else if(pa.content&&pa.content!=="none"&&pa.position==="absolute"&&(parseFloat(pa.borderTopLeftRadius)||0)>=4){r=parseFloat(pa.borderTopLeftRadius);pseudo="a"}}
    if(r<4||r>=999)return;
    var w=el.offsetWidth,h=el.offsetHeight;if(!w||!h)return;
    if(r>=Math.min(w,h)/2-1)return; // circles stay circles
    var key=w+'x'+h;if(el.dataset.hc===key)return;
    if(!el.dataset.hs){n++;el.dataset.hs=n}
    el.dataset.hc=key;
    var path=outline(w,h,r,+el.dataset.hs);
    var cp="path('"+path+"')";
    if(pseudo){el.dataset.hp=pseudo;el.style.setProperty("--hcp",cp);return}
    // never clip something that has a badge or chip hanging over its edge: leave those smooth
    var b=el.getBoundingClientRect(),over=false;el.querySelectorAll("*").forEach(function(c){var q=c.getBoundingClientRect();if(q.width&&(q.left<b.left-1||q.top<b.top-1||q.right>b.right+1||q.bottom>b.bottom+1))over=true});
    if(over)return;
    el.style.clipPath=cp;el.style.webkitClipPath=cp;
  }
  function all(root){if(root.querySelectorAll)root.querySelectorAll('*').forEach(shape)}
  function go(){all(document.body);
    new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(nd){if(nd.nodeType===1){shape(nd);all(nd)}})})}).observe(document.body,{childList:true,subtree:true});
    document.addEventListener('click',function(){setTimeout(function(){all(document.body)},60)},true);
    addEventListener('resize',function(){all(document.body)})}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();
</script>
