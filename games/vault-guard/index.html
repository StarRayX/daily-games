<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vault Guard</title>
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<style>
@font-face{font-family:"Allo";src:url("../../shared/AlloVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--grape:#7a4dff;--stripe:#9672ff;--ink:#22105c;--cream:#fff6e8;--card:#fffaf0;--gold:#ffc93c;--pink:#ff6eb4;--mint:#3ad6a0;--tile:#d6c9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ink);font-family:"Allo",system-ui,sans-serif;font-variation-settings:"ROND" 30,"opsz" 14;font-weight:600;overflow:hidden;touch-action:manipulation;user-select:none}
img{display:block}
#app{position:relative;max-width:none;height:100%;margin:0 auto;overflow:hidden;background:var(--grape)}
#app.start,#app.end{background:var(--grape)}
/* stripes and dots live on their own layer, masked to soft random patches */
#app.start::before,#app.end::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(255,255,255,.3) 1.6px,transparent 2.2px) 0 0/15px 15px,repeating-linear-gradient(-32deg,var(--grape) 0 60px,var(--stripe) 60px 120px);-webkit-mask-image:radial-gradient(circle at var(--p0x,12%) var(--p0y,8%),rgba(0,0,0,var(--p0a,.85)) 0,transparent var(--p0r,34%)),radial-gradient(circle at var(--p1x,88%) var(--p1y,28%),rgba(0,0,0,var(--p1a,.85)) 0,transparent var(--p1r,30%)),radial-gradient(circle at var(--p2x,10%) var(--p2y,55%),rgba(0,0,0,var(--p2a,.85)) 0,transparent var(--p2r,32%)),radial-gradient(circle at var(--p3x,90%) var(--p3y,74%),rgba(0,0,0,var(--p3a,.85)) 0,transparent var(--p3r,34%)),radial-gradient(circle at var(--p4x,50%) var(--p4y,96%),rgba(0,0,0,var(--p4a,.85)) 0,transparent var(--p4r,28%));mask-image:radial-gradient(circle at var(--p0x,12%) var(--p0y,8%),rgba(0,0,0,var(--p0a,.85)) 0,transparent var(--p0r,34%)),radial-gradient(circle at var(--p1x,88%) var(--p1y,28%),rgba(0,0,0,var(--p1a,.85)) 0,transparent var(--p1r,30%)),radial-gradient(circle at var(--p2x,10%) var(--p2y,55%),rgba(0,0,0,var(--p2a,.85)) 0,transparent var(--p2r,32%)),radial-gradient(circle at var(--p3x,90%) var(--p3y,74%),rgba(0,0,0,var(--p3a,.85)) 0,transparent var(--p3r,34%)),radial-gradient(circle at var(--p4x,50%) var(--p4y,96%),rgba(0,0,0,var(--p4a,.85)) 0,transparent var(--p4r,28%))}
section{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;gap:16px;padding:20px 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden}
section.on{display:flex}
.btn{font:inherit;font-weight:800;font-size:17px;border:0;background:#111;color:#fff;min-height:52px;padding:0 22px;border-radius:10px;cursor:pointer}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{opacity:.3;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
/* ---------- wordmark: same recipe as Sprout, two lines ---------- */
.out{filter:drop-shadow(.045em 0 0 var(--ink)) drop-shadow(-.045em 0 0 var(--ink)) drop-shadow(0 .045em 0 var(--ink)) drop-shadow(0 -.045em 0 var(--ink)) drop-shadow(0 .09em 0 var(--ink))}
.wm{display:flex;flex-direction:column;align-items:center;font-size:min(18vw,84px);line-height:1;padding-top:.3em}
.wm .ln{display:flex;align-items:flex-end;justify-content:center;white-space:nowrap}
.wm .ln+.ln{margin-top:.1em}
.wm .L{display:block;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;line-height:.8;color:var(--c);-webkit-text-stroke:.13em var(--s);paint-order:stroke fill;margin:0 -.005em;transform:translateY(var(--y,0)) rotate(var(--r,0deg))}
.wm .o{display:block;position:relative;width:.86em;height:.72em;margin:0 .01em;transform:translateY(var(--y,0)) rotate(var(--r,0deg))}
.wm .o img{position:absolute;left:0;bottom:-.06em;width:.86em;height:.86em;display:block}
.wm .o i{position:absolute;left:0;bottom:-.06em;width:1.39em;height:1.39em;display:grid;place-items:center;font-style:normal;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;font-size:.62em;line-height:1;color:var(--cream);padding-top:.06em}
.wm.sm{font-size:48px;padding-top:0}
.pop{display:inline-block;font-weight:900;color:var(--f);-webkit-text-stroke:.13em var(--s);paint-order:stroke fill}
.tagrow{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px}
.tagrow img{width:72px;height:72px;transform:rotate(-8deg)}
.tag{display:inline-block;font-size:20px;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;letter-spacing:.14em;line-height:1;color:#fff;transform:rotate(-5deg);margin-left:4px}
.pop{--f:var(--cream);--s:var(--gold);--o:.05em;font-variation-settings:"ROND" 100,"opsz" 32;filter:drop-shadow(var(--o) 0 0 var(--ink)) drop-shadow(calc(var(--o)*-1) 0 0 var(--ink)) drop-shadow(0 var(--o) 0 var(--ink)) drop-shadow(0 calc(var(--o)*-1) 0 var(--ink)) drop-shadow(0 .08em 0 var(--ink))}
/* ---------- landing ---------- */
#start{justify-content:safe center;text-align:center;gap:0;position:absolute;z-index:1}
.lede{margin:30px 0 0;max-width:310px;font-size:22px;line-height:1.2;font-weight:800;color:var(--cream);text-wrap:balance}
#play{margin-top:24px;min-height:58px;padding:0 54px;font-size:21px}
#sfine{margin-top:12px;font-size:15px;font-weight:700;line-height:1.45;color:var(--cream);opacity:.85;min-height:20px}
/* ---------- play ---------- */
#game{justify-content:flex-start;--cw:min(440px,max(300px,calc(100vh - 340px)))}
#game .card{margin-block:auto}
.card{width:100%;max-width:var(--cw,440px);background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px;flex:none;text-align:left}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;font-weight:800}
.tries{display:flex;align-items:center;gap:10px}
.pips{display:flex;gap:5px}
.pips i{width:15px;height:15px;border-radius:48% 52% 50% 46%;background:var(--tile)}
.pips i.win{background:var(--mint)}.pips i.red{background:var(--pink)}.pips i.now{background:var(--gold)}
#steps{font-weight:700;font-variant-numeric:tabular-nums}
.gw{position:relative;width:calc(100% + 6px);margin:-3px;aspect-ratio:1;background:var(--card)}
.gw svg.lay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#rt polyline{fill:none;stroke:var(--pink);stroke-width:4.5;stroke-dasharray:0 10;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);z-index:2}
.cell{position:relative;isolation:isolate;border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;overflow:visible;min-height:48px;container-type:inline-size}
.dc{container-type:inline-size}
.cell::before{content:"";position:absolute;inset:3px;z-index:-1;border-radius:10px;background:var(--bg,var(--tile));filter:url(#r1)}
.cell:nth-child(3n+2)::before{filter:url(#r2)}
.cell:nth-child(3n)::before{filter:url(#r3)}
.cell:active{--bg:#c7b6ff}
.cell.lp{--bg:#c4b3ff}
.cell.plan{--bg:#ffc2e0}
.cell.hit{--bg:#ff9ccb}
.cell.ok{--bg:#a9edd0}
.cell.win{--bg:var(--mint)}
.cell.seen{--bg:#ffd45e}
.cell.caught{--bg:var(--pink)}
.ic{position:absolute;left:50%;top:50%;width:70%;height:70%;transform:translate(-50%,-50%);z-index:2}
.ic.door{width:88%;height:88%}
.ic.start{width:88%;height:88%;z-index:1}
.ic img{width:100%;height:100%}
.bd{position:absolute;left:2px;top:2px;display:flex;flex-wrap:wrap;gap:2px;z-index:3;max-width:92%}
.bd i{width:clamp(16px,26cqw,20px);height:clamp(16px,26cqw,20px);border-radius:48% 52% 46% 54%;background:var(--pink);font-style:normal;font-size:clamp(11px,18cqw,14px);font-weight:800;line-height:clamp(16px,26cqw,20px);text-align:center;color:var(--ink)}
.bd i.warn{background:var(--ink);color:var(--gold)}
.hitmark{position:absolute;right:4px;top:4px;display:flex;align-items:center;gap:2px;font-size:clamp(11px,18cqw,14px);font-weight:800;z-index:3;line-height:1;background:var(--ink);color:var(--cream);border-radius:8px 10px 7px 10px;padding:2px 5px}
.chips{position:absolute;left:4px;right:4px;bottom:4px;display:flex;flex-direction:column;align-items:flex-start;gap:0;z-index:3}
.gho{display:flex;align-items:center;gap:1px;background:var(--cream);border-radius:7px 9px 6px 9px;padding:1px 3px 1px 1px;line-height:1}
.gho img{width:var(--gs,18px);height:var(--gs,18px);flex:none}
.gho .ar{display:block;width:18px;height:18px;border-radius:5px 6px 5px 6px;background:#7a4dff;color:#fff;font-size:15px;font-weight:900;line-height:18px;text-align:center;flex:none;margin-right:2px}
.gho i{font-style:normal;font-size:14px;font-weight:900;color:var(--ink);line-height:var(--gs,18px);white-space:nowrap;letter-spacing:-.08em}
#ctl{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px}
#ctl .btn{padding:0 8px}
#sneak{font-size:20px}
#say{font-weight:900;font-size:20px;line-height:1.2;display:flex;flex-direction:column;gap:4px;min-height:72px;text-align:left}
#say small{font-weight:600;font-size:15px;line-height:1.3;opacity:.72}
#legend{display:grid;grid-template-columns:repeat(3,1fr);justify-items:start;gap:8px 8px;align-items:center}
#legend .k.w2{grid-column:span 2}
.cell:not(.dc) .gho{font-size:clamp(10px,15cqw,14px);max-width:100%}
.cell:not(.dc) .gho .ar{width:1.45em;height:1.45em;font-size:.95em;line-height:1.45em;margin-right:1px}
.cell:not(.dc) .gho i{font-size:1em;line-height:1.45em}
.top{flex-wrap:nowrap}.tries,#tryno,#steps{white-space:nowrap;flex:none}.tries{min-width:0}
#legend .k{display:flex;flex-direction:row;align-items:center;gap:4px;font-size:13px;font-weight:700;line-height:1.1;white-space:nowrap}
#legend img{width:20px;height:20px}
#legend .sw{width:20px;height:20px;border-radius:7px 9px 6px 9px;background:#ffd45e}
/* ---------- result ---------- */
#end{position:absolute;z-index:1;gap:10px;color:var(--cream)}
.herorow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
#stamp{width:84px;height:84px;transform:rotate(-8deg);animation:thunk .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes thunk{0%{transform:rotate(-8deg) scale(1.6);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
.big{font-size:84px;line-height:1}
#end .big.pop{filter:none;-webkit-text-stroke:0;color:var(--cream);font-weight:900}
.big small{font-size:.5em}
#ctitle{font-size:24px;font-weight:800;text-align:center;line-height:1.1}
.res{color:var(--ink);gap:14px;margin-top:4px}
.res{align-items:center}
.meta{width:100%;display:flex;justify-content:space-between;font-size:16px;font-weight:800}
#rrows{display:flex;flex-direction:column;gap:6px;align-items:center}
.hrow{display:flex;gap:1px;align-items:center}
.hrow b{width:18px;font-size:15px;font-weight:800}
.hrow em{font-style:normal;font-size:14px;font-weight:700;margin-left:7px;white-space:nowrap;line-height:1.1}
.t{position:relative;display:block;width:15px;height:15px;border-radius:5px 6px 4px 6px;background:var(--tile);flex:none}
.t.blue{background:var(--mint)}
.t.red{background:var(--pink)}
.t.win{background:var(--gold)}
.t.red::before,.t.red::after{content:"";position:absolute;left:3px;top:6.5px;width:10px;height:2.6px;border-radius:2px;background:var(--ink);transform:rotate(43deg)}
.t.red::after{width:9px;left:3.5px;transform:rotate(-50deg)}
.t.win::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg)}
.safe{display:flex;flex-direction:column;gap:8px;align-items:center}
.mini{display:grid;grid-template-columns:repeat(5,38px);flex:none;gap:0}
.mini i{position:relative;isolation:isolate;width:38px;height:38px;font-style:normal;font-size:14px;font-weight:800;display:grid;place-items:center}
.mini i::before{content:"";position:absolute;inset:2px;z-index:-1;border-radius:9px;background:var(--bg,var(--tile));filter:url(#r2)}
.mini i:nth-child(3n)::before{filter:url(#r3)}
.mini i.p{--bg:var(--mint)}
.safe p{margin:0;font-size:15px;line-height:1.3;text-align:center;opacity:.75}
.acts{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.link{background:none;border:0;font:inherit;font-weight:800;font-size:16px;color:var(--cream);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:14px 4px;min-height:48px}
#cfine{font-size:15px;font-weight:700;text-align:center}

/* ---------- motion ---------- */
.cell::before{transition:background-color .28s ease}
.cell.pn::before{animation:tpop .26s cubic-bezier(.3,1.4,.5,1)}
@keyframes tpop{0%{transform:scale(.8)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.bd i.pn{animation:pop .26s cubic-bezier(.3,1.4,.5,1)}
.gho.new{animation:pop .4s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d,0s);transform-origin:0 100%}
.hitmark.new{animation:pop .4s cubic-bezier(.3,1.4,.5,1) both;transform-origin:100% 0}
.ic.door{transition:opacity .2s}
#grid.atdoor .ic.door{opacity:0}
/* actors: thief and guards live above the grid and glide between tiles */
.acts{position:absolute;inset:0;pointer-events:none;z-index:3;--aw:20%}
.ac{position:absolute;left:0;top:0;width:var(--aw);height:var(--aw);transition:transform .38s cubic-bezier(.3,.8,.3,1),opacity .25s ease}
.ac.snap,.ac.snap .sp{transition:none}
.ac.off{opacity:0}
.ac .sp{position:absolute;display:block;transition:transform .32s cubic-bezier(.3,.8,.3,1)}
.ac .sp img{display:block;width:100%;height:100%}
.ac.th .sp{left:18%;top:12%;width:64%;height:64%}
.ac.th .sp.hop{animation:hop .36s ease-out}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-20%)}100%{transform:translateY(0)}}
.ac.th .al{position:absolute;left:-4%;top:-8%;width:46%;height:46%;transform:scale(0);transform-origin:50% 100%;transition:transform .26s cubic-bezier(.3,1.6,.5,1)}
.ac.th .al img{display:block;width:100%;height:100%}
.ac.th.hit .al{transform:scale(1)}
.ac.th.hit .sp{animation:wob .3s ease-in-out 3}
@keyframes wob{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.ac.gd .sp{top:2px;right:calc(2px + var(--gi,0)*6px);width:46%;height:46%}
.ac.gd.alert .sp img{animation:alert .3s ease-in-out 4}
@keyframes alert{50%{transform:scale(1.3)}}
.gw.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.gw.flash::after{content:"";position:absolute;inset:0;background:var(--pink);opacity:0;animation:flash .9s ease-out;z-index:7;pointer-events:none}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
.bnr{position:absolute;left:50%;z-index:8;transform:translateX(-50%) rotate(-4deg);padding:8px 22px;border-radius:14px;font-size:30px;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;line-height:1.1;color:var(--ink);background:var(--pink);white-space:nowrap;pointer-events:none;animation:bnr .4s cubic-bezier(.3,1.5,.5,1) both}
.bnr.ok{background:var(--mint)}
@keyframes bnr{0%{transform:translateX(-50%) rotate(-4deg) scale(.3);opacity:0}100%{transform:translateX(-50%) rotate(-4deg) scale(1);opacity:1}}
#pctl{display:none;grid-template-columns:1fr 2fr;gap:8px}
#pctl .btn{padding:0 8px}
#pstep{font-size:20px}
.hdr{width:100%;max-width:var(--cw,440px);display:flex;justify-content:flex-end;flex:none;margin-bottom:-8px}
.hdr .link,#hl1{padding:6px 4px;min-height:34px;font-size:15px}
/* last try overlay */
#ltrow{display:flex;align-items:center;flex-wrap:wrap;gap:0 12px;margin-top:-8px}
#ltrow[hidden]{display:none}
#ltnote[hidden]{display:none}
.tgl{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-height:44px;font:inherit;font-weight:800;font-size:15px;color:var(--ink);cursor:pointer}
.tgl .trk{position:relative;width:46px;height:26px;border-radius:13px;background:var(--tile);transition:background-color .2s;flex:none}
.tgl .trk::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl[aria-checked=true] .trk{background:var(--grape)}
.tgl[aria-checked=true] .trk::after{transform:translateX(20px)}
#ltnote{font-size:13px;font-weight:700;opacity:.7;line-height:1.2}
#lt{position:absolute;inset:0;pointer-events:none;z-index:3}
#lt.fresh{animation:fadein .3s ease-out}
@keyframes fadein{0%{opacity:0}100%{opacity:1}}
#lt svg{position:absolute;inset:0;width:100%;height:100%}
#lt polyline{fill:none;stroke:rgba(34,16,92,.36);stroke-width:4.5;stroke-dasharray:0 10;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#lt .lnum{position:absolute;transform:translate(-100%,-50%);margin-left:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:rgba(34,16,92,.55);color:var(--cream);font-size:12px;font-weight:800;line-height:18px;text-align:center;white-space:nowrap}
#lt .lnum.nx{transform:translate(-100%,-100%);margin-top:-3px}
#lt .xx{position:absolute;width:34px;height:34px;transform:translate(-50%,-50%)}
#lt .xx::before,#lt .xx::after{content:"";position:absolute;left:3px;top:14px;width:28px;height:6px;border-radius:3px;background:rgba(34,16,92,.72);transform:rotate(45deg)}
#lt .xx::after{transform:rotate(-45deg)}
/* first-play spotlight tour */
#tour{position:absolute;inset:0;z-index:12;display:none;pointer-events:none}
#tour.on{display:block}
#tsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tfull,.tb{position:absolute;background:transparent;pointer-events:auto}
#tfull{inset:0}
.tc{fill:#000}
.tr{fill:none;stroke:var(--cream);stroke-width:3}
.tc,.tr{transition:x .3s ease,y .3s ease,width .3s ease,height .3s ease}
#tour.nt .tc,#tour.nt .tr,#tour.nt #tcard{transition:none}
#tcard{position:absolute;left:0;top:0;width:min(290px,calc(100% - 16px));background:var(--card);color:var(--ink);border-radius:14px;box-shadow:0 8px 24px rgba(20,10,40,.4);pointer-events:auto;transition:left .3s ease,top .3s ease;text-align:left}
.tband{height:14px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(-45deg,var(--gold) 0 8px,var(--grape) 8px 16px)}
.tin{padding:10px 16px 14px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px}
#tstep{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.tskip,.tback{font:inherit;font-weight:800;font-size:13px;color:var(--grape);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 2px;min-height:32px}
#ttitle{font-size:19px;font-weight:900;line-height:1.15;margin-top:2px}
#tbody{margin:6px 0 0;font-size:15px;line-height:1.3;font-weight:600;opacity:.85}
.tfoot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.tdots{display:flex;gap:5px}
.tdots i{width:8px;height:8px;border-radius:50%;background:var(--tile);transition:width .2s,background-color .2s}
.tdots i.on{width:20px;border-radius:5px;background:var(--grape)}
.tbtns{display:flex;align-items:center;gap:10px}
#tnext{min-height:44px;padding:0 24px;font-size:16px;background:var(--grape)}
#ttail{position:absolute;width:14px;height:14px;background:var(--card);transform:rotate(45deg);border-radius:3px}
#ttail.up{background:var(--gold)}
#hwtour{color:var(--ink);padding:6px 4px;min-height:36px;font-size:15px}
/* how to play */

<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const $=id=>document.getElementById(id);
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ds(new Date())}
function dayNum(sd){const m=/^(d+)-(d+)-(d+)$/.exec(sd||'');if(!m)return 1;return Math.max(1,Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(2026,10,22))/864e5)+1)}
function load(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let HON=false,TOUR=null;
function show(id){if(id!=='game')hintHide();['start','game','end'].forEach(s=>$(s).classList.toggle('on',s===id));$('app').className=id;['start','game','end'].forEach(s=>{if(s===id)$(s).scrollTop=0})}
let ac;function tone(f,d,type,vol,slide){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,ac.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);g.gain.setValueAtTime(vol||.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ---------- the vault ----------
// 5x5 floor, tile i = row*5+col, row 0 is the top. Start bottom-left, exit top-right.
// MAXS is 10, not 8: start to exit is already 8 steps, so 8 would leave no room to wait.
const N=5,CELLS=25,START=20,EXIT=4,MAXA=5,MAXS=10;
const rc=i=>[Math.floor(i/N),i%N];
const ix=(r,c)=>r*N+c;
const GN=['A','B','C'],DEG=[0,90,180,270];
const LAB=['0·4·8','1·5·9','2·6·10','3·7'];
const ALL=new Set([0,1,2,3]);
function moves(i){const [r,c]=rc(i),o=[];if(r>0)o.push(i-N);if(c<N-1)o.push(i+1);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);o.push(i);return o}
// A guard loops through 4 tiles. Slot s = turn number mod 4. sl[s] holds his tile, his facing and the tiles he sees.
function mkGuard(r){
  let cyc;
  if(r()<.5){
    const R=Math.floor(r()*4),C=Math.floor(r()*4);
    cyc=[ix(R,C),ix(R,C+1),ix(R+1,C+1),ix(R+1,C)];
    if(r()<.5)cyc=[cyc[0],cyc[3],cyc[2],cyc[1]];
  }else{
    const a=Math.floor(r()*3),o=Math.floor(r()*N),h=r()<.5;
    const A=h?ix(o,a):ix(a,o),B=h?ix(o,a+1):ix(a+1,o),C=h?ix(o,a+2):ix(a+2,o);
    cyc=[A,B,C,B];
  }
  const off=Math.floor(r()*4),g={cyc,off,sl:[]};
  for(let s=0;s<4;s++){
    const p=cyc[(s+off)%4],q=cyc[(s+1+off)%4],[pr,pc]=rc(p),[qr,qc]=rc(q);
    const dr=Math.sign(qr-pr),dc=Math.sign(qc-pc);
    const dir=dr<0?0:dc>0?1:dr>0?2:3;
    const ar=pr+dr,ac2=pc+dc,a=(ar>=0&&ar<N&&ac2>=0&&ac2<N)?ix(ar,ac2):-1;
    g.sl.push({p,dir,seen:a<0?[p]:[p,a]});
  }
  return g;
}
// which guard (index) sees this tile on this turn, or -1
function catcher(gs,t,tile){for(let g=0;g<gs.length;g++)if(gs[g].sl[t%4].seen.includes(tile))return g;return -1}
// S = the set of turn slots the player has already learned. Unknown slots look safe to the planner.
function blocked(gs,S,t,tile){return S.has(t%4)&&catcher(gs,t,tile)>=0}
function run(gs,route){
  for(let k=1;k<=route.length;k++){const g=catcher(gs,k,route[k-1]);if(g>=0)return{win:false,at:k,g,tile:route[k-1]}}
  return{win:route.length>0&&route[route.length-1]===EXIT,at:route.length}
}
// Route planner. 'short' = fewest steps (first or random tie), 'random' = any route that can still finish in time.
function pickRoute(gs,S,mode,rng){
  const INF=99,D=[];
  for(let k=0;k<=MAXS;k++)D.push(new Array(CELLS).fill(INF));
  for(let k=MAXS;k>=0;k--)for(let t=0;t<CELLS;t++){
    if(t===EXIT&&k>0){D[k][t]=0;continue}
    if(k===MAXS)continue;
    let b=INF;for(const m of moves(t)){if(blocked(gs,S,k+1,m))continue;const d=D[k+1][m];if(d+1<b)b=d+1}
    D[k][t]=b;
  }
  if(D[0][START]>=INF)return null;
  let k=0,cur=START;const route=[];
  while(cur!==EXIT){
    let c=moves(cur).filter(m=>!blocked(gs,S,k+1,m)&&D[k+1][m]<INF);
    if(mode!=='random'){const mn=Math.min(...c.map(m=>D[k+1][m]));c=c.filter(m=>D[k+1][m]===mn)}
    const m=rng?c[Math.floor(rng()*c.length)]:c[0];
    route.push(m);cur=m;k++;
  }
  return route;
}
// A learner uses everything a failure reveals: steps 1..s of every guard.
function learnerRun(gs,mode,rng){
  const S=new Set([0]);let stuck=0;
  for(let a=1;a<=MAXA;a++){
    const route=pickRoute(gs,S,mode,rng);if(!route)return{n:0,stuck:1};
    const r=run(gs,route);if(r.win)return{n:a,stuck};
    const before=S.size;for(let t=1;t<=r.at;t++)S.add(t%4);if(S.size===before)stuck=1;
  }
  return{n:0,stuck};
}
const NAIVE=[[15,10,5,0,1,2,3,4],[21,22,23,24,19,14,9,4],[15,16,11,12,7,8,3,4]];
function genDay(seed){
  let last=null;
  for(let a=0;a<4000;a++){
    const r=mulberry32(hashStr(seed+'#'+a));
    const gs=[mkGuard(r),mkGuard(r),mkGuard(r)];
    const st=gs.map(g=>g.sl[0].p);
    if(new Set(st).size<3)continue;
    if(catcher(gs,0,START)>=0)continue;
    if(NAIVE.some(rt=>run(gs,rt).win))continue;
    const par=learnerRun(gs,'short',null).n;
    if(par<2||par>4)continue;
    last={gs,par,tries:a+1,safe:pickRoute(gs,ALL,'short',null)};
    if(par>=3||a>=200)return last;
  }
  if(last)return last;
  last={gs:[mkGuard(mulberry32(1)),mkGuard(mulberry32(2)),mkGuard(mulberry32(3))],par:0,tries:4000,bad:true};
  last.safe=pickRoute(last.gs,ALL,'short',null);return last;
}
function check(){
  let bad=0,fb=0;const hist={},worst={};
  for(let d=1;d<=60;d++){
    const s='2026-12-'+String(d).padStart(2,'0'),day=genDay(s),gs=day.gs;
    if(day.bad)fb++;
    if(JSON.stringify(genDay(s).gs)!==JSON.stringify(gs))bad++;
    if(gs.length!==3)bad++;
    gs.forEach(g=>{for(let t=0;t<4;t++){const a=g.sl[t],b=g.sl[(t+1)%4];
      const [ar,ac2]=rc(a.p),[br,bc]=rc(b.p);if(Math.abs(ar-br)+Math.abs(ac2-bc)!==1)bad++;
      if(!(a.p>=0&&a.p<CELLS)||a.seen.some(x=>!(x>=0&&x<CELLS)))bad++;
      if(a.seen[0]!==a.p||a.seen.length>2)bad++}});
    if(catcher(gs,0,START)>=0)bad++;
    if(new Set(gs.map(g=>g.sl[0].p)).size<3)bad++;
    // a safe route exists, is short enough, and really survives a literal turn by turn replay
    const safe=pickRoute(gs,ALL,'short',null);
    if(!safe||safe.length>MAXS||!run(gs,safe).win)bad++;
    // the blind straight paths must fail
    if(NAIVE.some(rt=>run(gs,rt).win))bad++;
    // optimal learner uses every reveal and still needs more than one try, never more than 5
    const L=learnerRun(gs,'short',null);
    if(L.n<2||L.n>MAXA||L.stuck||L.n!==day.par)bad++;
    hist[L.n]=(hist[L.n]||0)+1;
    // 12 random learners: any route consistent with what they have learned
    const rr=mulberry32(hashStr('learn'+s));let wc=0;
    for(let q=0;q<12;q++){const m=learnerRun(gs,q%2?'short':'random',rr);if(m.n<1||m.stuck)bad++;wc=Math.max(wc,m.n)}
    worst[wc]=(worst[wc]||0)+1;
  }
  console.log('Vault Guard self-check, 60 days, par spread',JSON.stringify(hist),'worst random learner',JSON.stringify(worst),'fallback days',fb,'problems:',bad);
}
check();

// ---------- art ----------
const IMG=(n,st)=>'<img src="assets/'+n+'.svg" alt=""'+(st?' style="'+st+'"':'')+'>';
// bubbly wordmark: per-letter fill and inner outline, a little bounce each. The A of VAULT is a vault door.
function wordmark(){
  const L=(c,f,s,r,y)=>'<span class="L" aria-hidden="true" style="--c:'+f+';--s:'+s+';--r:'+r+'deg;--y:'+y+'em">'+c+'</span>';
  const cr='#fff6e8',crS='#ffc93c',go='#ffc93c',goS='#f0900f',pk='#ff6eb4',pkS='#e0368e',mt='#3ad6a0',mtS='#1fa87a';
  const door='<span class="o" aria-hidden="true" style="--r:4deg;--y:-.02em">'+IMG('vault-disc')+'<i>A</i></span>';
  return '<div class="ln">'+L('V',cr,crS,-5,.02)+door+L('U',go,goS,-3,.03)+L('L',pk,pkS,5,-.02)+L('T',mt,mtS,-4,.03)+'</div>'
    +'<div class="ln">'+L('G',go,goS,4,.0)+L('U',cr,crS,-4,.03)+L('A',pk,pkS,3,-.03)+L('R',mt,mtS,-5,.03)+L('D',go,goS,5,-.02)+'</div>';

function demo(m){
  seed='2026-12-07';practice=true;locked=false;pb=null;pbRow=null;fx=null;day=genDay(seed);plan=[];att=[];resetStage();

  const sn=m==='sneak'||m==='sneakmid',snm=m;if(sn)m='game';
  for(let a=0;a<MAXA;a++){
    const rt=pickRoute(gs,S,'short',null),r=run(gs,rt);
    if(r.win){if(m==='end')att.push({route:rt,win:true,at:rt.length,g:-1,tile:rt[rt.length-1]});else plan=rt.slice(0,5);break}
    att.push({route:rt,win:false,at:r.at,g:r.g,tile:r.tile});

  }

  reshape();
}

  }
})();
