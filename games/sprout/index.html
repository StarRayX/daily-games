<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sprout</title>
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Allo";src:url("../../shared/AlloVariable.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--g:#8ee03a;--g2:#9fe85a;--ink:#1e4a0e;--cream:#fff8e0;--card:#fffaf0;--tom:#ff5a3c;--sun:#ffcf3a;--sky:#4cb6ff;--soil:#c9a878;--tile:#ebe2c2;--lime2:#b8ec7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--g);color:var(--ink);font-family:"Allo",system-ui,sans-serif;font-weight:700;overflow:hidden;touch-action:manipulation;user-select:none}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden;background:var(--g)}
section{position:absolute;inset:0;display:none;flex-direction:column;padding:12px 12px calc(12px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden}
section.on{display:flex}
/* ground: plain flat lime, with stripes and dots on a layer that a few soft random spots reveal */
.gnd{background:var(--g)}
.gnd::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(rgba(255,255,255,.3) 1.6px,transparent 2.2px) 0 0/14px 14px,repeating-linear-gradient(-32deg,var(--g) 0 52px,var(--g2) 52px 104px);-webkit-mask-image:radial-gradient(circle at var(--p0x,12%) var(--p0y,8%),rgba(0,0,0,var(--p0a,.85)) 0,transparent var(--p0r,24%)),radial-gradient(circle at var(--p1x,88%) var(--p1y,28%),rgba(0,0,0,var(--p1a,.85)) 0,transparent var(--p1r,24%)),radial-gradient(circle at var(--p2x,10%) var(--p2y,55%),rgba(0,0,0,var(--p2a,.85)) 0,transparent var(--p2r,24%)),radial-gradient(circle at var(--p3x,90%) var(--p3y,74%),rgba(0,0,0,var(--p3a,.85)) 0,transparent var(--p3r,24%)),radial-gradient(circle at var(--p4x,50%) var(--p4y,96%),rgba(0,0,0,var(--p4a,.85)) 0,transparent var(--p4r,22%));mask-image:radial-gradient(circle at var(--p0x,12%) var(--p0y,8%),rgba(0,0,0,var(--p0a,.85)) 0,transparent var(--p0r,24%)),radial-gradient(circle at var(--p1x,88%) var(--p1y,28%),rgba(0,0,0,var(--p1a,.85)) 0,transparent var(--p1r,24%)),radial-gradient(circle at var(--p2x,10%) var(--p2y,55%),rgba(0,0,0,var(--p2a,.85)) 0,transparent var(--p2r,24%)),radial-gradient(circle at var(--p3x,90%) var(--p3y,74%),rgba(0,0,0,var(--p3a,.85)) 0,transparent var(--p3r,24%)),radial-gradient(circle at var(--p4x,50%) var(--p4y,96%),rgba(0,0,0,var(--p4a,.85)) 0,transparent var(--p4r,22%))}
.gnd>*{position:relative}
button{font-family:inherit}
.wi{display:block}
.spr{display:block;height:100%;aspect-ratio:1/1;background-size:500% 100%;background-repeat:no-repeat}
.mk{width:36px;height:36px;display:block}
.btn{border:0;background:#111;color:#fff;font:inherit;font-weight:800;font-size:20px;padding:0 44px;min-height:54px;border-radius:10px;cursor:pointer}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.3;cursor:default}
.btn.alt{background:#e8e1c2;color:var(--ink)}
.link{background:none;border:0;font:inherit;font-weight:800;font-size:16px;color:var(--ink);text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:14px;min-height:48px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.small{font-size:14px;font-weight:700}
/* ---------- hand-cut flat tiles: the fill lives on a pseudo layer so only the shape wobbles, never the text ---------- */
.card,.rep,.pt,.fcell,.slot,.cell,.sc,.seed,.chip,.plot,#ctitle{position:relative;isolation:isolate}
.card::before,.rep::before,.pt::before,.fcell::before,.slot::before,.cell::before,.sc::before,.seed::before,.chip::before,.plot::before,#ctitle::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:var(--rd,10px);background:var(--bg,var(--tile));filter:url(#rough1);pointer-events:none;transition:background .2s}
:is(.pt,.fcell,.slot,.cell,.sc,.seed,.chip,.plot):nth-child(3n+2)::before{filter:url(#rough2)}
:is(.pt,.fcell,.slot,.cell,.sc,.seed,.chip,.plot):nth-child(3n)::before{filter:url(#rough3)}
.card::before,.rep::before{background:var(--card)}
.fcell,.cell,.sc,.seed,.plot{--bg:var(--tile)}
.cell.off::before{display:none}
/* ---------- wordmark ---------- */
.out{filter:drop-shadow(.045em 0 0 var(--ink)) drop-shadow(-.045em 0 0 var(--ink)) drop-shadow(0 .045em 0 var(--ink)) drop-shadow(0 -.045em 0 var(--ink)) drop-shadow(0 .09em 0 var(--ink))}
.wm{display:flex;align-items:flex-end;justify-content:center;font-size:min(18vw,84px);line-height:1;padding-top:.3em}
.wm .L{display:block;font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;line-height:.8;color:var(--c);-webkit-text-stroke:.13em var(--s);paint-order:stroke fill;margin:0 -.005em;transform:translateY(var(--y,0)) rotate(var(--r,0deg))}
.wm .o{display:block;position:relative;width:.8em;height:.72em;margin:0 -.01em;transform:translateY(var(--y,0)) rotate(var(--r,0deg))}
.wm .o svg{position:absolute;left:0;bottom:.04em;width:.8em;height:1.3em;overflow:visible}
.tg{display:block;font-size:min(9vw,40px);font-weight:900;font-variation-settings:"ROND" 100,"opsz" 32;line-height:.9;color:var(--sun);-webkit-text-stroke:.13em var(--tom);paint-order:stroke fill;transform:rotate(-7deg);margin:0}
.tg.out{padding:0 .1em}
/* ---------- landing ---------- */
#start{align-items:center;justify-content:center;gap:18px;text-align:center}
#start .tg{margin:.02em 0 4px 36%}
#start p{margin:0;max-width:300px;font-size:21px;line-height:1.25;font-weight:800;text-wrap:balance}
#sfine{font-size:14px;font-weight:700}
/* ---------- game ---------- */
#game{--rh:clamp(38px,calc((100vh - 500px)/5),80px);--sw:clamp(52px,calc((100vh - 420px)/6.5),84px);--c1:56px;--c2:44px}
.card{--rd:20px;flex:1 0 auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.card header{display:flex;align-items:center;gap:10px}
.sn{flex:1;display:flex;flex-direction:column;line-height:1.1}
.sn b{font-size:28px;font-weight:900}
.prog{display:flex;gap:6px}
.pt{--bg:#e4dab8;--rd:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;transition:transform .15s}
.pt.on,.pt.done{--bg:var(--c)}
.pt.on{transform:scale(1.15)}
.gr{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.fcl{font-size:14px;line-height:1.1;font-weight:800}
.fcell{display:flex;flex-direction:column;align-items:center;padding:4px 0 3px}
.fcell span{font-size:14px;line-height:1.15;font-weight:800;white-space:nowrap}
.fcell.now{--bg:var(--lime2)}
#rows{display:flex;flex-direction:column;gap:6px}
.slot{--bg:var(--soil);--rd:12px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot .spr{height:auto;width:112%;flex:none}
.slot.pend .spr{opacity:.5}
.slot.today{--bg:#e2c68f}
.slot .pn{font-size:18px;font-weight:900;color:#7a5a30}
.cell{aspect-ratio:1;display:flex;justify-content:center;padding-top:4px}
.cell .wi{width:24px;height:24px}
.cell.up{--bg:#d4f5a3}
.cell.down{--bg:#ffd2c7}
.cell b{position:absolute;right:5px;bottom:1px;font-size:14px;line-height:15px;font-weight:900}
.cell b:empty{display:none}
.sc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.sc.pop{animation:flip .45s ease}
.sc.t0{--bg:#d9c39a}.sc.t1{--bg:#c8f08f}.sc.t3{--bg:#8ee03a}.sc.t5{--bg:#ffcf3a}
@keyframes flip{0%{transform:rotateX(0)}45%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
#shelf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:4px}
.seed{--rd:14px;min-width:0;border:0;padding:8px 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:inherit;color:inherit;transition:transform .12s;background:none}
.seed.gold{--bg:var(--sun)}
.seed .pw{display:block;width:min(var(--sw),100%);margin:-3px 0 -4px}.seed .pw .spr{width:100%;height:auto}
.chips{display:flex;gap:6px;width:100%;justify-content:center;padding:0 3px}
.chip{--bg:#d4f5a3;--rd:9px;flex:1;max-width:32px;height:30px;display:flex;align-items:center;justify-content:center}
.chip.hate{--bg:#ffd2c7}
.chip .wi{width:72%;height:auto}
.chip::after{content:"+";position:absolute;left:-9px;top:-11px;width:24px;height:24px;border-radius:50%;background:#3fbf4f;color:var(--cream);font-size:19px;line-height:24px;font-weight:900;text-align:center}
.chip.hate::after{content:"\2212";background:var(--tom)}
.rb{position:absolute;right:-4px;top:-9px;background:var(--tom);color:var(--cream);font-size:13px;font-weight:900;padding:0 6px;line-height:18px;border-radius:9px}
.seed.sel{--bg:var(--lime2);transform:translateY(-5px)}
.seed.gold.sel{--bg:#ffdf6e}
.seed.used{opacity:.3}
#key{display:flex;gap:20px;justify-content:flex-start;flex-wrap:nowrap;white-space:nowrap;font-size:14px;font-weight:700;align-items:center;padding-left:5px}
#key span{display:inline-flex;align-items:center;gap:8px}
#key .chip{flex:none;width:28px;height:26px;margin-left:10px}
#key .chip .wi{width:16px}
#say{min-height:58px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;padding-top:2px}
#say .st{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:20px;line-height:1.2;font-weight:900}
#say .st em{font-style:normal;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
#say .sl{font-size:15px;line-height:1.3;font-weight:600;opacity:.75;text-wrap:pretty}
#btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:2px}
#btns .btn{padding:0 12px}
#btns.one{grid-template-columns:1fr}
/* ---------- result ---------- */
#end{--ph:clamp(46px,calc((100vh - 540px)/3),62px);align-items:center;gap:8px}
#end .wm{font-size:48px;margin-top:4px}
#cdate{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.rep{--rd:20px;width:100%;padding:16px 14px 14px;display:flex;flex-direction:column;gap:12px}
.sline{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.big{display:flex;align-items:baseline;line-height:.9}
.big b{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums}
.big span{font-size:22px;font-weight:800}
#ctitle{--bg:var(--sun);--rd:12px;padding:6px 10px;font-weight:900;font-size:16px;line-height:1.1;text-align:center;max-width:none;transform:rotate(-3deg)}
.bed{display:flex;flex-direction:column;gap:10px}
.sh{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;margin-bottom:5px}
.sh i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.sh em{margin-left:auto;font-style:normal;font-weight:900}
.pl5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.plot{--rd:12px;height:var(--ph);display:flex;align-items:center;justify-content:center}
.plot .spr{height:98%}
.tag{position:absolute;right:-2px;bottom:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--lime2);color:var(--ink);font-size:14px;line-height:20px;font-style:normal;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.plot.t0 .tag{background:#d9c39a}.plot.t3 .tag{background:#8ee03a}.plot.t5 .tag{background:var(--sun)}
#cnote{font-size:14px;font-weight:700;text-align:center}
.rep .btn{align-self:center}
#end .tail{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
#cfine{text-align:center;font-size:14px;font-weight:800}
@media (max-width:400px){.fcell span i{display:none}.cell .wi{width:22px;height:22px}.slot .pn{font-size:16px}.sn b{font-size:24px}}
@media (max-height:700px){#game .card{gap:8px;padding:10px 12px}#say{min-height:56px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="rough1" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.044" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="rough2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.048" numOctaves="2" seed="16" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="rough3" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.052000000000000005" numOctaves="2" seed="23" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="roughO" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<div id="app">
  <section id="start" class="on gnd">
    <div class="wmw"><div class="wm out" role="img" aria-label="Sprout"></div><span class="tg out" aria-hidden="true">GROW!</span></div>
    <p>Plant one seed a day. Match it to the weather it loves.</p>
    <button class="btn" id="play">Play</button>
    <span id="sfine"></span>
  </section>

  <section id="game" data-s="0">
    <div class="card">
      <header>
        <img class="mk" src="assets/mark.svg" alt="">
        <div class="sn"><b id="season"></b><span class="small" id="streak"></span></div>
        <div class="prog" id="prog"></div>
      </header>
      <div class="gr" id="fc" aria-label="Five day forecast"></div>
      <div id="rows" aria-label="Plots"></div>
      <div id="shelf" aria-label="Seeds"></div>
      <div id="key"></div>
      <div id="say"></div>
      <div id="btns" class="one"><button class="btn alt" id="back" style="display:none">Back</button><button class="btn" id="plant" disabled>Plant</button></div>
    </div>
  </section>

  <section id="end" class="gnd">
    <div class="wm out sm" role="img" aria-label="Sprout"></div>
    <span id="cdate"></span>
    <div class="rep">
      <div class="sline"><div class="big"><b id="cscore"></b><span id="cpar"></span></div><div id="ctitle"></div></div>
      <div class="bed" id="rtiles" aria-label="Result"></div>
      <div id="cnote"></div>
    </div>
    <div class="tail"><button class="btn" id="copy">Copy result</button><div id="cfine"></div><button class="link" id="prac">Try a practice day</button></div>
  </section>
</div>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const $=id=>document.getElementById(id);
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ds(new Date())}
function load(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
(function(){const R=Math.random,v={};for(let i=0;i<5;i++){const left=i%2===0;v['--p'+i+'x']=Math.round(left?R()*28:72+R()*28)+'%';v['--p'+i+'y']=Math.round(i*22+R()*14-2)+'%';v['--p'+i+'a']=(.7+R()*.3).toFixed(2);v['--p'+i+'r']=Math.round(16+R()*12)+'%'}document.querySelectorAll('.gnd').forEach(n=>{for(const k in v)n.style.setProperty(k,v[k])})})();
function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('on',s===id))}
let ac;function tone(f,d,type,vol,slide){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,ac.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);g.gain.setValueAtTime(vol||.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ---------- the garden ----------
const WN=['Sun','Rain','Frost','Wind'],WF=['sun','rain','frost','wind'];
const PL=['tomato','carrot','corn','cabbage','pea','radish'],PN=['Tomato','Carrot','Corn','Cabbage','Pea','Radish'];
const COL=['#3fbf4f','#ffcf3a','#ff5a3c'];
const OSVG='<svg viewBox="0 0 80 130" aria-hidden="true"><g paint-order="stroke" stroke-linejoin="round"><path transform="translate(40 66) rotate(-128) scale(1.3)" d="M0 0C4 -14 24 -15 32 0C24 15 4 14 0 0Z" fill="#3fbf4f" stroke="#b8ec7a" stroke-width="10"/><path transform="translate(40 66) rotate(-52) scale(1.3)" d="M0 0C4 -14 24 -15 32 0C24 15 4 14 0 0Z" fill="#3fbf4f" stroke="#b8ec7a" stroke-width="10"/><ellipse cx="40" cy="92" rx="31" ry="35" fill="#ffcf3a" stroke="#ff9a1f" stroke-width="13"/><ellipse cx="40" cy="93" rx="12" ry="15" fill="#fff8e0" stroke="#ff9a1f" stroke-width="8"/></g></svg>';
function wmHTML(){
  const L=(ch,c,sc,r,y)=>'<span class="L" style="--c:'+c+';--s:'+sc+';--r:'+r+'deg;--y:'+y+'em">'+ch+'</span>';
  return L('S','#ff5a3c','#d93a1c',-6,.03)+L('P','#ffcf3a','#ff9a1f',4,-.03)+L('R','#4cb6ff','#1f86d9',-4,.03)
   +'<span class="o" style="--r:5deg;--y:-.02em">'+OSVG+'</span>'+L('U','#fff8e0','#ffcf3a',5,-.02)+L('T','#ff5a3c','#d93a1c',-5,.03);
}
document.querySelectorAll('.wm').forEach(e=>{e.innerHTML=wmHTML()});
function wIcon(k,px){return '<img class="wi" src="assets/weather-'+WF[k]+'.svg" width="'+px+'" height="'+px+'" alt="'+WN[k]+'">'}
function pIdx(i,s){return (i+2*(s==null?si:s))%6}
function spr(p,stage,gold){return '<span class="spr" style="background-image:url(assets/'+(gold?'golden-flower':'plant-'+PL[p])+'.svg);background-position:'+(stage*25)+'% 0"></span>'}

// plot k (0 to 4) grows on days k to 4. Plot 0 sees five days of weather, plot 4 sees one.
function eff(s,w){return (s.love===w?(s.gold?2:1):0)-(s.hate===w?1:0)}
function plotScore(s,k,fc){let t=0;for(let d=k;d<5;d++)t+=eff(s,fc[d]);return Math.max(0,t)}
function totalOf(assign,day){let t=0;for(let k=0;k<5;k++)t+=plotScore(day.seeds[assign[k]],k,day.fc);return t}
const PERMS=[];(function g(a,rest){if(!rest.length){PERMS.push(a);return}rest.forEach((x,i)=>g(a.concat(x),rest.filter((_,j)=>j!==i)))})([],[0,1,2,3,4]);
function solve(day){let par=-1,count=0,best=null;for(const p of PERMS){const t=totalOf(p,day);if(t>par){par=t;count=1;best=p}else if(t===par)count++}return {par,count,best}}
const PAR_MIN=9,PAR_MAX=20;
const SEASONS=[
 {n:'Spring',pool:[0,1,2],gold:false,min:8,max:11},
 {n:'Summer',pool:[0,1,2],gold:true,min:10,max:16},
 {n:'Autumn',pool:[0,1,2,3],gold:true,min:11,max:20,need:[2,3],dbl:true}
];
function dblCount(b){return b.seeds.filter(s=>b.fc.includes(s.love)&&b.fc.includes(s.hate)).length}
function genBoard(seed,si){
  const S=SEASONS[si];let last=null;
  for(let a=0;a<30000;a++){
    const r=mulberry32(hashStr(seed+'s'+si+'g'+a));
    const fc=Array.from({length:5},()=>S.pool[Math.floor(r()*S.pool.length)]);
    if(new Set(fc).size<3)continue;
    if(S.need&&!S.need.every(w=>fc.includes(w)))continue;
    const gold=S.gold?Math.floor(r()*5):-1;
    const seeds=Array.from({length:5},(_,i)=>{const love=Math.floor(r()*4);let hate=Math.floor(r()*3);if(hate>=love)hate++;return {love,hate,gold:i===gold}});
    const b={fc,seeds,attempt:a,si};
    const dc=dblCount(b);
    if(S.clean&&dc>0)continue;
    if(S.dbl&&dc<1)continue;
    const s=solve(b);b.par=s.par;b.best=s.best;b.count=s.count;last=b;
    if(s.count===1&&s.par>=S.min&&s.par<=S.max){b.ok=true;return b}
  }
  if(last)last.ok=false;return last;
}
function genDay(seed){const boards=[0,1,2].map(i=>genBoard(seed,i));return {boards,par:boards.reduce((p,b)=>p+(b?b.par:0),0)}}
// day-by-day growth, used by the game and by the self-check
function simulate(assign,b){const sums=[0,0,0,0,0];for(let d=0;d<5;d++)for(let j=0;j<=d;j++)sums[j]+=eff(b.seeds[assign[j]],b.fc[d]);return sums.map(x=>Math.max(0,x))}
function check(){
  let bad=0,maxA=0,note=[];
  const base=new Date(2026,10,22);
  for(let i=0;i<60;i++){
    const sd=ds(new Date(base.getTime()+i*864e5)),day=genDay(sd);
    day.boards.forEach((b,si)=>{
      const S=SEASONS[si],p=[];
      if(!b||!b.ok){bad++;note.push(sd+' '+S.n+': no valid board');return}
      maxA=Math.max(maxA,b.attempt);
      let best=-1,cnt=0;
      for(let a=0;a<5;a++)for(let c=0;c<5;c++){if(c===a)continue;for(let d=0;d<5;d++){if(d===a||d===c)continue;for(let e=0;e<5;e++){if(e===a||e===c||e===d)continue;const f=10-a-c-d-e;const t=totalOf([a,c,d,e,f],b);if(t>best){best=t;cnt=1}else if(t===best)cnt++}}}
      if(cnt!==1)p.push('best not unique ('+cnt+')');
      if(best!==b.par)p.push('par mismatch');
      if(b.par<S.min||b.par>S.max)p.push('par out of range '+b.par);
      if(simulate(b.best,b).reduce((x,y)=>x+y,0)!==b.par)p.push('day-by-day sim differs from par');
      if(b.seeds.filter(s=>s.gold).length!==(S.gold?1:0))p.push('golden count');
      if(b.seeds.some(s=>s.love===s.hate))p.push('love equals hate');
      if(S.need&&!S.need.every(w=>b.fc.includes(w)))p.push('autumn lacks frost or wind');
      if(S.dbl&&dblCount(b)<1)p.push('no double-active seed');
      if(S.clean&&dblCount(b)>0)p.push('spring not clean');
      if(p.length){bad+=p.length;note.push(sd+' '+S.n+': '+p.join('; '))}
    });
  }
  note.forEach(n=>console.log('Sprout problem',n));
  console.log('Sprout self-check, 60 days x 3 seasons, most retries '+maxA+', problems:',bad);
  return bad;
}
check();

// ---------- game ----------
let seed,practice,day,si,k,assign,pend,played,phase,seasonScores,results;
let DUR=(()=>{try{return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches?120:520}catch(e){return 520}})();
const B=()=>day.boards[si];
function tileClass(n){return n>=5?'t5':n>=3?'t3':n>=1?'t1':'t0'}
function emoji(n){return n>=5?'🟨':n>=1?'🟩':'🟫'}
function begin(s,p){
  seed=s;practice=p;day=genDay(s);
  const done=!p&&load('sp3_'+s,null);
  if(done){results=done;return showCard()}
  seasonScores=[];startSeason(0);
}
function startSeason(i){si=i;k=0;assign=[null,null,null,null,null];pend=null;played=0;phase='pick';show('game');render()}
function chip(kind,love,gold){return '<span class="chip '+(love?'love':'hate')+'">'+wIcon(kind,22)+'</span>'}
function raw(j,upto){let t=0;for(let d=j;d<upto;d++)t+=eff(B().seeds[assign[j]],B().fc[d]);return t}
function scHTML(j){
  if(assign[j]===null||played<=j)return '';
  const v=Math.max(0,raw(j,played));return String(v);
}
function stageOf(j){
  if(assign[j]===null||played<=j)return 0;
  const r=raw(j,played);
  if(r<0||(phase==='end'&&r<=0))return 4;
  return r>=5?3:r>=3?2:r>=1?1:0;
}
function render(){
  const b=B(),streak=load('sp_streak',0);
  $('game').dataset.s=si;
  $('season').textContent=SEASONS[si].n;
  $('prog').innerHTML=[0,1,2].map(i=>'<span class="pt'+(i===si?' on':i<si?' done':'')+'" style="--c:'+COL[i]+'">'+(i+1)+'</span>').join('');
  $('streak').textContent=(streak?'Streak '+streak+' · ':'')+'Season '+(si+1)+' of 3';
  const live=phase==='pick'||phase==='grow';
  $('fc').innerHTML='<div class="fcl">Fore-<br>cast</div>'+b.fc.map((w,d)=>'<div class="fcell'+(live&&d===k?' now':'')+'" data-d="'+d+'">'+wIcon(w,30)+'<span><i style="font-style:normal">Day </i>'+(d+1)+'</span></div>').join('')+'<div></div>';
  $('rows').innerHTML=[0,1,2,3,4].map(j=>{
    const a=assign[j],pv=(a===null&&j===k&&pend!==null&&phase==='pick');
    const cells=b.fc.map((w,d)=>{
      if(d<j)return '<div class="cell off"><i></i></div>';
      let cls='on',t='';
      if(a!==null&&d<played){const e=eff(b.seeds[a],w);cls+=e>0?' up':e<0?' down':' zero';t=e>0?'+'+e:e<0?String(e):'0'}
      return '<div class="cell '+cls+'">'+wIcon(w,24)+'<b>'+t+'</b></div>';
    }).join('');
    const sv=scHTML(j),sc=sv===''?'sc':'sc '+tileClass(Math.max(0,raw(j,played)));
    const inner=a!==null?spr(pIdx(a),stageOf(j),b.seeds[a].gold):pv?spr(pIdx(pend),0,b.seeds[pend].gold):'<span class="pn">'+(j+1)+'</span>';
    return '<div class="rw gr"><div class="slot'+(j===k&&live?' today':'')+(pv?' pend':'')+'" data-k="'+j+'">'+inner+'</div>'+cells+'<div class="'+sc+'">'+sv+'</div></div>';
  }).join('');
    $('shelf').innerHTML=b.seeds.map((s,i)=>{const p=pIdx(i);return '<button class="seed'+(s.gold?' gold':'')+(pend===i?' sel':'')+(assign.includes(i)?' used':'')+'" data-s="'+i+'" aria-label="'+(s.gold?'Golden ':'')+PN[p]+' seed, loves '+WN[s.love]+(s.gold?' double':'')+', hates '+WN[s.hate]+'"><span class="pw">'+spr(p,3,s.gold)+'</span><span class="chips">'+chip(s.love,true,s.gold)+chip(s.hate,false,false)+'</span>'+(s.gold?'<span class="rb">x2</span>':'')+'</button>'}).join('');
  $('key').innerHTML='<span><i class="chip love">'+wIcon(0,16)+'</i>grows +1</span><span><i class="chip hate">'+wIcon(0,16)+'</i>wilts −1</span>';
  const showBack=phase==='pick'&&pend!==null;
  $('back').style.display=showBack?'':'none';$('btns').className=showBack?'':'one';
  $('plant').textContent=phase==='end'?(si<2?'Next season':'See result'):'Plant';
  $('plant').disabled=!(phase==='end'||(phase==='pick'&&pend!==null));
  let st='',sl='';
  if(phase==='pick'){if(pend===null){st='Day '+(k+1);sl='Pick a seed for plot '+(k+1)+'.'}else{const sd=b.seeds[pend];st=(sd.gold?'Golden ':'')+PN[pIdx(pend)];sl='Loves '+WN[sd.love].toLowerCase()+(sd.gold?' (x2)':'')+', hates '+WN[sd.hate].toLowerCase()+'. Plant it in plot '+(k+1)+'.'}}
  else if(phase==='grow'){st='Day '+(k+1)+' weather'}
  else if(phase==='end'){st=SEASONS[si].n+' done';sl='Par is '+b.par+', the best possible.'}
  let tot=0;for(let j=0;j<5;j++)if(assign[j]!==null&&played>j)tot+=Math.max(0,raw(j,played));
  $('say').innerHTML='<div class="st"><span>'+st+'</span><em>'+(phase==='end'?tot+' of '+b.par:'Score '+tot)+'</em></div>'+(sl?'<div class="sl">'+sl+'</div>':'');
}
function tapSeed(i){
  if(phase!=='pick'||assign.includes(i))return;
  pend=pend===i?null:i;
  tone(520,.06,'triangle',.06);buzz(10);render();
}
function back(){if(phase!=='pick'||pend===null)return;pend=null;tone(300,.06,'triangle',.05);render()}
function cellAt(j,d){const r=$('rows').children&&$('rows').children[j];return r&&r.children&&r.children[1+d]}
function plant(){
  if(phase==='end'){return si<2?startSeason(si+1):finish()}
  if(phase!=='pick'||pend===null)return;
  assign[k]=pend;pend=null;phase='grow';render();
  const b=B(),w=b.fc[k],today=k;
  const sums=[];for(let j=0;j<=today;j++)sums[j]=raw(j,today);
  const gap=Math.round(DUR/5);
  for(let j=0;j<=today;j++){
    setTimeout(()=>{
      const e=eff(b.seeds[assign[j]],w);sums[j]+=e;
      try{
        const c=cellAt(j,today);if(c){c.classList.add(e>0?'up':e<0?'down':'zero');c.lastChild.textContent=e>0?'+'+e:e<0?String(e):'0'}
        const row=$('rows').children[j],sc=row&&row.lastChild;
        if(sc){const v=Math.max(0,sums[j]);sc.className='sc pop '+tileClass(v);sc.textContent=v}
      }catch(x){}
      if(e>0){tone(520+j*60,.14,'triangle',.07,760+j*60);buzz(10)}else if(e<0){tone(260,.18,'sawtooth',.04,150);buzz(20)}else tone(360,.06,'sine',.03);
    },j*gap);
  }
  setTimeout(()=>{
    played=today+1;
    if(today===4){seasonScores[si]=simulate(assign,b);phase='end'}else{k=today+1;phase='pick'}
    render();
  },(today+1)*gap+Math.round(DUR*.6));
}
function finish(){
  results=seasonScores.map(s=>s.slice());
  if(!practice){
    save('sp3_'+seed,results);
    const days=load('sp_days',[]);
    if(!days.includes(seed)){days.push(seed);save('sp_days',days);
      const last=load('sp_last',''),y=ds(new Date(Date.now()-864e5));
      save('sp_streak',last===y?load('sp_streak',0)+1:1);save('sp_last',seed)}
  }
  tone(660,.3,'triangle',.1,990);buzz([20,40,20]);
  showCard();
}
function showCard(){
  const sums=results.map(r=>r.reduce((p,c)=>p+c,0)),tot=sums.reduce((p,c)=>p+c,0),par=day.par;
  show('end');phase='done';
  $('cdate').textContent=practice?'Practice day':'Sprout '+seed;
  const gap=par-tot;
  $('ctitle').textContent=gap<=0?'Perfect garden':gap<=4?'Green thumb':gap<=10?'Growing nicely':gap<=18?'Needs more sun':'Mostly weeds';
  $('cscore').textContent=tot;$('cpar').textContent=' / '+par;
  $('cnote').textContent='Par is '+par+', the best possible total.';
  $('rtiles').innerHTML=results.map((r,i)=>'<div class="blk"><div class="sh"><i style="--c:'+COL[i]+'"></i>'+SEASONS[i].n+'<em>'+sums[i]+' / '+day.boards[i].par+'</em></div><div class="pl5">'+r.map((n,j)=>'<div class="plot '+tileClass(n)+'">'+spr(pIdx(j,i),n===0?4:n>=5?3:n>=3?2:1,false)+'<i class="tag">'+n+'</i></div>').join('')+'</div></div>').join('');
  $('cfine').textContent=practice?'Practice does not count':'Streak '+load('sp_streak',0)+' · same garden for everyone today';
  window._share='Sprout '+seed+'\n'+results.map(r=>r.map(emoji).join('')).join('\n')+' '+tot+'/'+par;
}
$('play').onclick=()=>begin(today(),false);
$('plant').onclick=plant;
$('back').onclick=back;
$('shelf').onclick=e=>{const b=e.target&&e.target.closest&&e.target.closest('.seed');if(b)tapSeed(+b.dataset.s)};
$('copy').onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(window._share):Promise.reject()).then(()=>$('copy').textContent='Copied!',()=>prompt('Copy:',window._share))};
$('prac').onclick=()=>{$('copy').textContent='Copy result';begin('practice-'+Math.random().toString(36).slice(2,7),true)};
addEventListener('error',e=>{const s=$('say');if(s)s.textContent='Error: '+e.message});
(function(){
  const pd=load('sp3_'+today(),null),stk=load('sp_streak',0);
  $('sfine').textContent=pd?'You played today':stk?'Streak '+stk+' · new garden every day':'A new garden every day';
})();
// test hooks: ?demo=start | game | end
(function(){
  const m=/[?&]demo=(\w+)/.exec(location.search);if(!m)return;
  const d=m[1];
  if(d==='game'||d==='end'){
    seed='demo-garden';practice=true;day=genDay(seed);
    if(d==='game'){
      seasonScores=[simulate(day.boards[0].best,day.boards[0])];
      startSeason(1);const bs=day.boards[1].best;
      for(let j=0;j<3;j++)assign[j]=bs[j];
      k=3;played=3;pend=bs[3];render();
    }else{
      results=day.boards.map(b=>simulate(b.best,b));showCard();
    }
  }
})();
</script>
<script>
/* Hand-cut corners v2: rough, hand-torn edges drawn as a vector clip-path outline (crisp at any pixel density, no filters). */
(function(){
  var st=document.createElement("style");st.textContent="[data-hp=b]::before{clip-path:var(--hcp);-webkit-clip-path:var(--hcp)}[data-hp=a]::after{clip-path:var(--hcp);-webkit-clip-path:var(--hcp)}";document.head.appendChild(st);
  var n=0;
  function R(seed){var x=Math.sin(seed*12.9898+78.233)*43758.5453;return x-Math.floor(x)}
  function outline(w,h,r,seed){
    // walk the perimeter of a rounded rectangle, sampling about every 5px, pushing each point in or out a little
    r=Math.min(r,w/2-1,h/2-1);
    var pts=[],step=5,amp=Math.max(1.6,Math.min(3.6,Math.min(w,h)*.055));
    var segs=[[r,0,w-r,0],[w,r,w,h-r],[w-r,h,r,h],[0,h-r,0,r]];
    var corners=[[w-r,r,-Math.PI/2],[w-r,h-r,0],[r,h-r,Math.PI/2],[r,r,Math.PI]];
    var k=0;
    for(var s=0;s<4;s++){
      var a=segs[s],len=Math.hypot(a[2]-a[0],a[3]-a[1]),m=Math.max(2,Math.round(len/step));
      var nx=[0,1,0,-1][s],ny=[-1,0,1,0][s];
      for(var i=0;i<m;i++){var t=i/m,x=a[0]+(a[2]-a[0])*t,y=a[1]+(a[3]-a[1])*t;
        var d=(Math.sin(k*.7+seed)*.45+ (R(seed*31+k)-.5)*1.1)*amp;k++;
        pts.push([x+nx*d,y+ny*d])}
      var c=corners[s],cm=Math.max(3,Math.round(r*1.57/step));
      for(var j=0;j<cm;j++){var an=c[2]+(Math.PI/2)*(j/cm),d2=(R(seed*17+k)-.5)*1.1*amp;k++;
        pts.push([c[0]+Math.cos(an)*(r+d2),c[1]+Math.sin(an)*(r+d2)])}
    }
    // smooth through midpoints so the wobble reads as a cut edge, not a zigzag
    var p='M'+((pts[0][0]+pts[1][0])/2).toFixed(1)+' '+((pts[0][1]+pts[1][1])/2).toFixed(1);
    for(var q=1;q<=pts.length;q++){var A=pts[q%pts.length],B=pts[(q+1)%pts.length];
      p+=' Q'+A[0].toFixed(1)+' '+A[1].toFixed(1)+' '+((A[0]+B[0])/2).toFixed(1)+' '+((A[1]+B[1])/2).toFixed(1)}
    return p+'Z';
  }
  function shape(el){
    if(!el.dataset)return;var cs=getComputedStyle(el);
    var r=parseFloat(cs.borderTopLeftRadius)||0;
    var pseudo="";
    if(r<4){var pb=getComputedStyle(el,"::before"),pa=getComputedStyle(el,"::after");
      if(pb.content&&pb.content!=="none"&&pb.position==="absolute"&&(parseFloat(pb.borderTopLeftRadius)||0)>=4){r=parseFloat(pb.borderTopLeftRadius);pseudo="b"}
      else if(pa.content&&pa.content!=="none"&&pa.position==="absolute"&&(parseFloat(pa.borderTopLeftRadius)||0)>=4){r=parseFloat(pa.borderTopLeftRadius);pseudo="a"}}
    if(r<4||r>=999)return;
    var w=el.offsetWidth,h=el.offsetHeight;if(!w||!h)return;
    if(r>=Math.min(w,h)/2-1)return; // circles stay circles
    var key=w+'x'+h;if(el.dataset.hc===key)return;
    if(!el.dataset.hs){n++;el.dataset.hs=n}
    el.dataset.hc=key;
    var path=outline(w,h,r,+el.dataset.hs);
    var cp="path('"+path+"')";
    if(pseudo){el.dataset.hp=pseudo;el.style.setProperty("--hcp",cp);return}
    // never clip something that has a badge or chip hanging over its edge: leave those smooth
    var b=el.getBoundingClientRect(),over=false;el.querySelectorAll("*").forEach(function(c){var q=c.getBoundingClientRect();if(q.width&&(q.left<b.left-1||q.top<b.top-1||q.right>b.right+1||q.bottom>b.bottom+1))over=true});
    if(over)return;
    el.style.clipPath=cp;el.style.webkitClipPath=cp;
  }
  function all(root){if(root.querySelectorAll)root.querySelectorAll('*').forEach(shape)}
  function go(){all(document.body);
    new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(nd){if(nd.nodeType===1){shape(nd);all(nd)}})})}).observe(document.body,{childList:true,subtree:true});
    document.addEventListener('click',function(){setTimeout(function(){all(document.body)},60)},true);
    addEventListener('resize',function(){all(document.body)})}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
})();
</script>
